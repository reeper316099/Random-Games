<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Solitaire (Klondike, Spider, FreeCell)</title>
  <style>
    :root{
      --bg:#0b0f17; --line:rgba(255,255,255,.14); --text:#e7eefc; --muted:#a9b6d3;
      --accent:#6aa6ff; --danger:#ff6a6a; --ok:#6affb6; --warn:#ffd36a;
      --felt:#0f5a3a; --felt2:#0a3f29; --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
      --pad:24px; --gap:10px; --cols:7;
      --bw:min(900px, calc(100vw - 2*var(--pad)));
      --cw:calc((var(--bw) - (var(--cols) - 1)*var(--gap)) / var(--cols));
      --ch:calc(var(--cw) * 1.4);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; justify-content:center;
      background:radial-gradient(1200px 600px at 20% 10%, #12203a 0%, var(--bg) 55%) fixed;
      color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      padding:var(--pad);
    }
    .wrap{ width:var(--bw); display:grid; gap:14px; align-content:start; margin-top:20px; }
    .topbar{
      display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 16px; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    }
    .title h1{ margin:0; font-size:18px; letter-spacing:.3px; }
    .title .sub{ color:var(--muted); font-size:12px; margin-top:2px; }
    .row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
    .pill{ display:inline-flex; gap:8px; align-items:center; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.04); font-size:13px; }
    button{
      border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text);
      padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; transition:filter .12s, transform .12s;
    }
    button:hover:not(:disabled){ filter:brightness(1.2); }
    button:active:not(:disabled){ transform:scale(.97); }
    button:disabled{ opacity:.35; cursor:not-allowed; }
    button.good{ background:linear-gradient(180deg, rgba(106,255,182,.28), rgba(106,255,182,.12)); border-color:rgba(106,255,182,.45); }
    button.bad{ background:linear-gradient(180deg, rgba(255,106,106,.28), rgba(255,106,106,.12)); border-color:rgba(255,106,106,.45); }
    button.primary{ background:linear-gradient(180deg, rgba(106,166,255,.35), rgba(106,166,255,.18)); border-color:rgba(106,166,255,.5); }
    button:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

    .felt{
      background:radial-gradient(ellipse at center, var(--felt) 0%, var(--felt2) 100%);
      border:1px solid rgba(255,255,255,.18); border-radius:24px; box-shadow:var(--shadow), inset 0 0 60px rgba(0,0,0,.45);
      padding:calc(var(--gap) + 4px); display:grid; gap:calc(var(--gap) + 6px); position:relative; justify-content:center;
    }
    .top, .tabs{ display:grid; grid-template-columns:repeat(var(--cols), var(--cw)); gap:var(--gap); }
    .slot{
      position:relative; width:var(--cw); height:var(--ch); border-radius:calc(var(--cw)*.1);
      border:2px dashed rgba(255,255,255,.22); background:rgba(0,0,0,.12);
      display:grid; place-items:center; color:rgba(255,255,255,.28); font-size:calc(var(--cw)*.4); user-select:none;
    }
    .pile{ position:relative; width:var(--cw); min-height:var(--ch); }
    .card{
      position:absolute; left:0; width:var(--cw); height:var(--ch); border-radius:calc(var(--cw)*.1);
      background:#fff; color:#111; box-shadow:0 2px 6px rgba(0,0,0,.45); font-weight:700; user-select:none; cursor:pointer;
      font-size:calc(var(--cw)*.28); border:1px solid rgba(0,0,0,.25);
    }
    .card.red{ color:#c81e3a; }
    .card .c1{ position:absolute; top:4%; left:7%; line-height:1; }
    .card .c2{ position:absolute; right:7%; bottom:4%; line-height:1; transform:rotate(180deg); }
    .card .big{ position:absolute; inset:0; display:grid; place-items:center; font-size:calc(var(--cw)*.55); padding-top:6%; }
    .card.down{
      background:repeating-linear-gradient(45deg,#2a3f9a,#2a3f9a 6px,#1d2d73 6px,#1d2d73 12px); border:3px solid #fff; cursor:default;
    }
    .card.down > *{ display:none; }
    .card.sel{ outline:3px solid var(--warn); outline-offset:1px; box-shadow:0 0 14px rgba(255,211,106,.7); z-index:50; }
    .card.hint, .slot.hint{ outline:3px solid var(--ok); outline-offset:1px; }
    .card.buried{ filter:brightness(.62); cursor:not-allowed; }
    .stock .card{ cursor:pointer; }
    .stockCount{ position:absolute; bottom:4px; right:6px; font-size:11px; color:#fff; background:rgba(0,0,0,.55); padding:1px 6px; border-radius:999px; z-index:60; pointer-events:none; }
    .msg{ text-align:center; font-weight:600; min-height:22px; font-size:14px; }
    .banner{
      position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.6); border-radius:24px; z-index:100; text-align:center; padding:16px;
    }
    .banner.show{ display:grid; }
    .banner h2{ margin:0 0 6px; font-size:26px; }
    .banner p{ margin:0 0 14px; color:var(--muted); }
    .panel{ display:grid; gap:12px; padding:14px 16px; background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    details.settings{ border:1px solid var(--line); border-radius:12px; padding:10px 14px; background:rgba(0,0,0,.2); }
    details.settings summary{ cursor:pointer; font-weight:600; font-size:14px; }
    .fields{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:12px 0; }
    .fields label{ display:grid; gap:4px; font-size:12px; color:var(--muted); }
    .fields label.off{ opacity:.45; }
    .fields select{ padding:8px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--text); font-size:14px; width:100%; }
    .faint{ color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:640px){ :root{ --pad:10px; --gap:4px; } .title .sub{ display:none; } button{ padding:8px 12px; } }
    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
  </style>
</head>
<body>
<a href="../index.html" style="position:fixed;top:8px;left:8px;z-index:9999;padding:4px 10px;border-radius:999px;background:rgba(15,23,42,.8);color:#e2e8f0;font:600 12px system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)">← Games</a>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <h1 id="h1">Solitaire</h1>
      <div class="sub" id="subLine"></div>
    </div>
    <div class="row">
      <span class="pill">Moves <b id="moves">0</b></span>
      <span class="pill" id="timePill">Time <b id="time">0:00</b></span>
    </div>
  </div>

  <div class="felt" id="felt">
    <div class="top" id="top"></div>
    <div class="tabs" id="tabs"></div>
    <div class="banner" id="banner">
      <div>
        <h2>🎉 You won!</h2>
        <p id="bannerText"></p>
        <button class="good" id="bannerNew">Deal again</button>
      </div>
    </div>
  </div>
  <div class="msg" id="msg"></div>

  <div class="panel">
    <div class="row">
      <button class="primary" id="newBtn">New game</button>
      <button id="undoBtn">↶ Undo</button>
      <button id="hintBtn">💡 Hint</button>
      <button id="autoBtn">⚡ Auto-finish</button>
    </div>
    <div class="faint" id="statsLine"></div>
    <details class="settings">
      <summary>⚙ Settings</summary>
      <div class="fields">
        <label>Game
          <select id="setVariant"><option value="klondike">Klondike (classic)</option><option value="spider">Spider</option><option value="freecell">FreeCell</option></select>
        </label>
        <label id="lblSuits">Spider suits
          <select id="setSuits"><option value="1">1 suit (easy)</option><option value="2">2 suits (medium)</option><option value="4">4 suits (hard)</option></select>
        </label>
        <label id="lblDraw">Klondike: cards drawn from stock
          <select id="setDraw"><option value="1">Draw 1 (easier)</option><option value="3">Draw 3 (classic)</option></select>
        </label>
        <label id="lblPasses">Klondike: times through the stock
          <select id="setPasses"><option value="0">Unlimited</option><option value="3">3 passes</option><option value="1">1 pass</option></select>
        </label>
        <label>Timer
          <select id="setTimer"><option value="on">Show</option><option value="off">Hide</option></select>
        </label>
      </div>
      <div class="row">
        <button class="good" id="applySettings">Apply &amp; new game</button>
        <button class="bad" id="clearCache">🗑 Clear cache</button>
      </div>
      <div class="faint" style="margin-top:8px">Settings and stats are saved in this browser. Clear cache erases them and restores the defaults.</div>
    </details>
  </div>
</div>

<script src="../scores.js"></script>
<script>
(() => {
  // report a result to the high-score table (no-op if scores.js is unavailable)
  const rgReport = (...a) => { try{ window.RGScores && window.RGScores.report(...a); }catch(e){} };
  const $ = id => document.getElementById(id);
  const SUITS = ["♠","♥","♦","♣"];
  const RL = {1:"A",11:"J",12:"Q",13:"K"};
  const rl = r => RL[r] || String(r);
  const isRed = s => s === "♥" || s === "♦";
  const NAMES = { klondike:"Klondike", spider:"Spider", freecell:"FreeCell" };
  const SUBS = {
    klondike:"Tap a card, then tap where it should go • Double-click a card to send it to the foundations",
    spider:"Build King→Ace runs in one suit to clear them • Any card can go on a card one rank higher • Deal from the stock when no columns are empty",
    freecell:"All cards face up • Four free cells hold one card each • Build foundations A→K by suit • Moves multiple cards if you have room"
  };
  const COLS = { klondike:7, spider:10, freecell:8 };
  const OFFS = { klondike:[0.14,0.3], spider:[0.12,0.25], freecell:[0.27,0.27] }; // [face-down, face-up] fan offsets
  const DEFAULTS = { variant:"klondike", suits:1, draw:3, passes:0, timer:true };
  const DEF_STAT = { games:0, wins:0, bestTime:null, bestMoves:null };

  let settings = { ...DEFAULTS };
  let stats = { klondike:{...DEF_STAT}, spider:{...DEF_STAT}, freecell:{...DEF_STAT} };
  let V = "klondike"; // active variant for the game in progress
  let S, sel = null, hist = [], seenSigs = [], moves = 0, seconds = 0, timerId = null, started = false, won = false, hintTimer = null;

  // ---------- storage (guarded) ----------
  function loadJSON(key){ try{ const o = JSON.parse(localStorage.getItem(key) || "null"); if(o && typeof o === "object") return o; }catch(e){} return null; }
  function saveJSON(key, o){ try{ localStorage.setItem(key, JSON.stringify(o)); }catch(e){} }
  function sanitize(o){
    return {
      variant: NAMES[o.variant] ? o.variant : "klondike",
      suits: [1,2,4].includes(Number(o.suits)) ? Number(o.suits) : 1,
      draw: Number(o.draw) === 1 ? 1 : 3,
      passes: [0,1,3].includes(Number(o.passes)) ? Number(o.passes) : 0,
      timer: o.timer !== false && o.timer !== "off"
    };
  }
  function loadStats(){
    const o = loadJSON("sol_stats");
    const out = { klondike:{...DEF_STAT}, spider:{...DEF_STAT}, freecell:{...DEF_STAT} };
    if(!o) return out;
    if(typeof o.games === "number") Object.assign(out.klondike, o); // older single-game format
    for(const v of Object.keys(NAMES)) if(o[v] && typeof o[v] === "object") Object.assign(out[v], o[v]);
    return out;
  }

  // ---------- setup ----------
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
  function fullDeck(){ const d = []; for(const s of SUITS) for(let r=1;r<=13;r++) d.push({r,s,up:false}); return d; }

  function newGame(){
    V = settings.variant;
    document.documentElement.style.setProperty("--cols", COLS[V]);
    if(V === "klondike"){
      const deck = shuffle(fullDeck());
      S = { stock:[], waste:[], found:[[],[],[],[]], tab:Array.from({length:7},()=>[]), passes:0 };
      for(let c=0;c<7;c++) for(let k=0;k<=c;k++){ const card = deck.pop(); card.up = (k === c); S.tab[c].push(card); }
      S.stock = deck;
    } else if(V === "spider"){
      const suitsUsed = SUITS.slice(0, settings.suits === 1 ? 1 : settings.suits === 2 ? 2 : 4);
      const deck = [];
      const copies = 8 / suitsUsed.length;
      for(let n=0;n<copies;n++) for(const s of suitsUsed) for(let r=1;r<=13;r++) deck.push({r,s,up:false});
      shuffle(deck);
      S = { stock:[], found:[], tab:Array.from({length:10},()=>[]) }; // found = list of completed suits
      for(let c=0;c<10;c++){ const n = c < 4 ? 6 : 5; for(let k=0;k<n;k++){ const card = deck.pop(); card.up = (k === n-1); S.tab[c].push(card); } }
      S.stock = deck; // 50 cards = 5 deals of 10
    } else {
      const deck = shuffle(fullDeck());
      deck.forEach(c => c.up = true);
      S = { cells:[null,null,null,null], found:[[],[],[],[]], tab:Array.from({length:8},()=>[]) };
      deck.forEach((c,i) => S.tab[i % 8].push(c));
    }
    sel = null; hist = []; seenSigs = []; moves = 0; seconds = 0; started = false; won = false;
    stopTimer(); clearHint(); $("banner").classList.remove("show");
    setMsg("");
    render();
  }

  // ---------- timer & stats ----------
  function startTimer(){
    if(started) return;
    started = true; stats[V].games++; saveJSON("sol_stats", stats);
    timerId = setInterval(() => { seconds++; renderHud(); }, 1000);
  }
  function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

  // ---------- rules ----------
  const top = p => p[p.length-1];
  function getCards(from){
    if(from.type === "waste") return S.waste.length ? [top(S.waste)] : [];
    if(from.type === "found") return S.found[from.i].length ? [top(S.found[from.i])] : [];
    if(from.type === "cell") return S.cells[from.i] ? [S.cells[from.i]] : [];
    return S.tab[from.i].slice(from.k);
  }
  // is this stack of cards a legal movable run for the current variant?
  function validRun(cards){
    for(let j=0;j<cards.length;j++){
      if(!cards[j].up) return false;
      if(j === 0) continue;
      const a = cards[j-1], b = cards[j];
      if(a.r !== b.r + 1) return false;
      if(V === "spider" && a.s !== b.s) return false;
      if(V === "freecell" && isRed(a.s) === isRed(b.s)) return false;
    }
    return true;
  }
  function canPlace(cards, to){
    if(!cards.length) return false;
    const c = cards[0];
    if(to.type === "found"){
      if(V === "spider" || cards.length !== 1) return false;
      const f = S.found[to.i];
      return f.length ? (top(f).s === c.s && c.r === top(f).r + 1) : c.r === 1;
    }
    if(to.type === "cell"){
      return V === "freecell" && cards.length === 1 && !S.cells[to.i];
    }
    if(to.type !== "tab") return false;
    const p = S.tab[to.i];
    if(V === "freecell"){
      const free = S.cells.filter(x => !x).length;
      let empty = 0; S.tab.forEach((q,i) => { if(!q.length && i !== to.i) empty++; });
      if(cards.length > (free + 1) * Math.pow(2, empty)) return false;
    }
    if(!p.length) return V === "klondike" ? c.r === 13 : true;
    const t = top(p);
    if(!t.up || c.r !== t.r - 1) return false;
    if(V === "spider") return true;
    return isRed(t.s) !== isRed(c.s);
  }
  // compact signature of a position, used so hints never lead back to a position already visited
  function sigOf(st){
    const pile = p => p.map(c => c.r + c.s + (c.up ? "u" : "d")).join("");
    return [st.tab.map(pile).join("|"), (st.found || []).map(f => typeof f === "string" ? f : pile(f)).join("|"),
      (st.cells || []).map(c => c ? c.r + c.s : "-").join(""), pile(st.waste || []), pile(st.stock || [])].join("#");
  }
  function snapshot(){
    hist.push(JSON.stringify(S)); seenSigs.push(sigOf(S));
    if(hist.length > 500){ hist.shift(); seenSigs.shift(); }
  }
  function unsnapshot(){ hist.pop(); seenSigs.pop(); }
  function removeFrom(from){
    if(from.type === "waste") S.waste.pop();
    else if(from.type === "found") S.found[from.i].pop();
    else if(from.type === "cell") S.cells[from.i] = null;
    else S.tab[from.i].splice(from.k);
  }
  function applyMove(from, to){
    const cards = getCards(from);
    if(!canPlace(cards, to)) return false;
    snapshot();
    doMove(from, to);
    afterMove();
    return true;
  }
  // performs a (already validated) move on S with no side effects beyond S itself
  function doMove(from, to){
    const cards = getCards(from);
    removeFrom(from);
    if(to.type === "found") S.found[to.i].push(...cards);
    else if(to.type === "cell") S.cells[to.i] = cards[0];
    else S.tab[to.i].push(...cards);
    if(from.type === "tab" && V !== "freecell"){ const p = S.tab[from.i]; if(p.length && !top(p).up) top(p).up = true; }
    if(V === "spider") spiderCollect();
  }
  // Spider: remove any completed K..A same-suit run from the end of a column
  function spiderCollect(){
    let again = true;
    while(again){
      again = false;
      for(let i=0;i<S.tab.length;i++){
        const p = S.tab[i];
        if(p.length < 13) continue;
        const run = p.slice(-13);
        if(run.every((c,j) => c.up && c.s === run[0].s && c.r === 13 - j)){
          p.splice(-13); S.found.push(run[0].s);
          if(p.length && !top(p).up) top(p).up = true;
          again = true;
        }
      }
    }
  }
  const isWon = () => V === "spider" ? S.found.length === 8 : S.found.every(f => f.length === 13);
  function afterMove(){
    moves++; startTimer(); sel = null; setMsg("");
    if(isWon()) return win();
    render();
  }
  function onStock(){
    sel = null;
    if(V === "spider"){
      if(!S.stock.length) return;
      if(S.tab.some(p => !p.length)){ setMsg("Fill every empty column before dealing from the stock."); return; }
      snapshot();
      for(let i=0;i<10;i++){ const c = S.stock.pop(); c.up = true; S.tab[i].push(c); }
      spiderCollect();
      afterMove();
      return;
    }
    // klondike
    snapshot();
    if(S.stock.length){
      const n = Math.min(settings.draw, S.stock.length);
      for(let i=0;i<n;i++){ const c = S.stock.pop(); c.up = true; S.waste.push(c); }
    } else if(S.waste.length){
      if(settings.passes > 0 && S.passes >= settings.passes - 1){
        unsnapshot(); setMsg(`No more passes through the stock (limit: ${settings.passes} pass${settings.passes>1?"es":""}).`); return;
      }
      S.passes++;
      S.stock = S.waste.reverse().map(c => ({ ...c, up:false }));
      S.waste = [];
    } else { unsnapshot(); return; }
    afterMove();
  }
  function win(){
    won = true; stopTimer();
    const st = stats[V];
    st.wins++;
    if(st.bestTime === null || seconds < st.bestTime) st.bestTime = seconds;
    if(st.bestMoves === null || moves < st.bestMoves) st.bestMoves = moves;
    saveJSON("sol_stats", stats);
    const cat = NAMES[V] + (V === "spider" ? ` · ${settings.suits} suit${settings.suits > 1 ? "s" : ""}` : V === "klondike" ? ` · Draw ${settings.draw}` : "");
    rgReport("solitaire", cat, "Fastest win", seconds, { unit:"s", better:"low", detail:`${moves} moves` });
    rgReport("solitaire", cat, "Fewest moves", moves, { unit:"moves", better:"low", detail:fmt(seconds) });
    $("bannerText").textContent = `${NAMES[V]} cleared in ${moves} moves${settings.timer ? " in " + fmt(seconds) : ""}.`;
    $("banner").classList.add("show");
    render();
  }

  // ---------- interaction ----------
  const same = (a,b) => a && b && a.type === b.type && a.i === b.i && a.k === b.k;
  function selectable(t){
    if(t.type === "waste") return S.waste.length > 0;
    if(t.type === "found") return V !== "spider" && S.found[t.i].length > 0;
    if(t.type === "cell") return !!S.cells[t.i];
    if(t.type === "tab"){
      if(t.k < 0 || !S.tab[t.i][t.k]) return false;
      return V === "klondike" ? S.tab[t.i][t.k].up : validRun(S.tab[t.i].slice(t.k));
    }
    return false;
  }
  function onTarget(t){
    if(won) return;
    clearHint();
    if(t.type === "stock"){ onStock(); return; }
    if(sel){
      if(same(sel, t)){ sel = null; render(); return; }
      if(["tab","found","cell"].includes(t.type) && applyMove(sel, { type:t.type, i:t.i })){ return; }
      if(t.type === "tab" && !selectable(t) && S.tab[t.i].length && sel){
        setMsg("That move isn't allowed.");
      }
      sel = selectable(t) ? t : null; render(); return;
    }
    if(selectable(t)){ sel = t; render(); }
    else if(t.type === "tab" && t.k >= 0 && S.tab[t.i][t.k] && S.tab[t.i][t.k].up){
      setMsg(V === "spider" ? "Only same-suit descending runs can be moved together." : "Only an alternating-colour descending run can be moved together.");
    }
  }
  function autoToFoundation(t){
    if(won || V === "spider" || !selectable(t)) return;
    if(getCards(t).length !== 1) return;
    for(let f=0; f<4; f++){
      if(t.type === "found" && t.i === f) continue;
      if(applyMove(t, { type:"found", i:f })) return;
    }
  }
  function undo(){
    if(!hist.length || won) return;
    seenSigs.pop(); S = JSON.parse(hist.pop()); sel = null; clearHint(); setMsg(""); render();
  }

  // ---------- hints & auto-finish ----------
  function findMoves(){
    const out = [], sources = [];
    if(V === "klondike" && S.waste.length) sources.push({ type:"waste" });
    if(V === "freecell") S.cells.forEach((c,i) => { if(c) sources.push({ type:"cell", i }); });
    for(let i=0;i<S.tab.length;i++) S.tab[i].forEach((c,k) => { const t = { type:"tab", i, k }; if(selectable(t)) sources.push(t); });
    for(const from of sources){
      const cards = getCards(from);
      if(V !== "spider") for(let f=0;f<4;f++) if(canPlace(cards,{type:"found",i:f})) out.push({ from, to:{ type:"found", i:f } });
      for(let i=0;i<S.tab.length;i++){
        if(from.type === "tab" && from.i === i) continue;
        if(!canPlace(cards,{type:"tab",i})) continue;
        if(from.type === "tab" && from.k === 0 && !S.tab[i].length) continue; // pointless: shuffling a whole column to an empty one
        out.push({ from, to:{ type:"tab", i } });
      }
    }
    return out;
  }
  function clearHint(){ if(hintTimer){ clearTimeout(hintTimer); hintTimer = null; } document.querySelectorAll(".card.hint, .slot.hint").forEach(e => e.classList.remove("hint")); }
  // would these two stacked cards already form a proper sequence in this variant?
  function seqOK(a, b){
    if(!a.up || a.r !== b.r + 1) return false;
    return V === "spider" ? a.s === b.s : isRed(a.s) !== isRed(b.s);
  }
  function simulate(m){
    const real = S;
    S = JSON.parse(JSON.stringify(S));
    try{ doMove(m.from, m.to); return sigOf(S); } finally { S = real; }
  }
  // FreeCell: parking a card in a free cell is only worth suggesting if it frees the card below to move somewhere
  function parkingMoves(){
    const out = [];
    if(V !== "freecell") return out;
    const free = S.cells.findIndex(c => !c);
    if(free < 0) return out;
    for(let i=0;i<S.tab.length;i++){
      const p = S.tab[i];
      if(p.length < 2) continue;
      const below = p[p.length-2];
      let sc = 0;
      for(let f=0;f<4;f++) if(canPlace([below],{type:"found",i:f})) sc = 30;
      if(!sc) for(let t=0;t<S.tab.length;t++) if(t !== i && S.tab[t].length && canPlace([below],{type:"tab",i:t})) sc = 15;
      if(sc) out.push({ from:{ type:"tab", i, k:p.length-1 }, to:{ type:"cell", i:free }, park:sc });
    }
    return out;
  }
  // signature after the next stock draw / recycle (Klondike), so we never suggest cycling the same cards forever
  function drawSig(){
    const real = S;
    S = JSON.parse(JSON.stringify(S));
    try{
      if(S.stock.length){ const n = Math.min(settings.draw, S.stock.length); for(let i=0;i<n;i++){ const c = S.stock.pop(); c.up = true; S.waste.push(c); } }
      else S.stock = S.waste.reverse().map(c => ({ ...c, up:false })), S.waste = [];
      return sigOf(S);
    } finally { S = real; }
  }
  function scoreMove(m){
    if(m.to.type === "cell") return m.park;
    const cards = getCards(m.from), c = cards[0];
    let sc = 0;
    if(m.to.type === "found") sc += 100;
    if(m.from.type === "tab"){
      const p = S.tab[m.from.i], k = m.from.k;
      if(k > 0 && !p[k-1].up) sc += 60;                      // reveals a face-down card
      else if(k === 0) sc += 25;                              // empties a column
      else if(seqOK(p[k-1], c)){                              // already sitting on a proper sequence
        const better = V === "spider" && m.to.type === "tab" && S.tab[m.to.i].length && top(S.tab[m.to.i]).s === c.s;
        if(!better) sc -= 50;
      }
    } else sc += 20;                                          // waste / free-cell cards
    if(m.to.type === "tab" && S.tab[m.to.i].length){
      const t = top(S.tab[m.to.i]);
      if(V === "spider" && t.s === c.s) sc += 40;             // builds a same-suit run
    }
    if(m.to.type === "tab" && !S.tab[m.to.i].length) sc -= 5; // don't burn empty columns lightly
    return sc;
  }
  function hintStock(){
    const el = document.querySelector(".stock .card, .stock .slot");
    if(el) el.classList.add("hint");
    hintTimer = setTimeout(clearHint, 2500);
  }
  function hint(){
    if(won) return;
    clearHint();
    const seen = new Set(seenSigs); seen.add(sigOf(S));
    const cands = findMoves().concat(parkingMoves())
      .filter(m => !seen.has(simulate(m)))                   // never lead back to a position you've already been in
      .map(m => ({ m, sc: scoreMove(m) }))
      .sort((a,b) => b.sc - a.sc);
    const best = cands[0];
    const canDraw = V === "klondike" ? ((S.stock.length > 0 || (S.waste.length > 0 && !(settings.passes > 0 && S.passes >= settings.passes - 1))) && !seen.has(drawSig()))
      : V === "spider" ? S.stock.length > 0 && S.tab.every(p => p.length) : false;
    if(!best || (best.sc <= 0 && canDraw)){
      if(canDraw){ setMsg(V === "klondike" ? "Hint: draw from the stock." : "Hint: deal a new row from the stock."); hintStock(); return; }
      if(!best){
        if(V === "spider" && S.stock.length) setMsg("Hint: fill the empty column(s), then deal from the stock.");
        else if(V === "freecell" && S.cells.some(c => !c)) setMsg("No useful moves — try parking a card in a free cell.");
        else setMsg("No useful moves left. Try undo or a new game.");
        return;
      }
    }
    const f = best.m.from, to = best.m.to;
    const el = f.type === "waste" ? document.querySelector('[data-kind="waste"] .card:last-child')
      : f.type === "cell" ? document.querySelector(`[data-pile="cell${f.i}"] .card`)
      : document.querySelector(`[data-pile="tab${f.i}"] .card[data-k="${f.k}"]`);
    if(el) el.classList.add("hint");
    const c = getCards(f)[0];
    const n = getCards(f).length;
    setMsg(`Hint: move ${n > 1 ? n + " cards starting with " : ""}${rl(c.r)}${c.s} to ${to.type === "found" ? "a foundation" : to.type === "cell" ? "a free cell" : "column " + (to.i + 1)}.`);
    hintTimer = setTimeout(clearHint, 2500);
  }
  function canAuto(){
    if(won || V === "spider") return false;
    if(V === "freecell") return true;
    return S.stock.length === 0 && S.waste.length === 0 && S.tab.every(p => p.every(c => c.up));
  }
  function autoFinish(){
    if(!canAuto()) return;
    const stepFn = () => {
      if(won) return;
      const srcs = [];
      for(let i=0;i<S.tab.length;i++) if(S.tab[i].length) srcs.push({ type:"tab", i, k:S.tab[i].length-1 });
      if(V === "freecell") S.cells.forEach((c,i) => { if(c) srcs.push({ type:"cell", i }); });
      for(const t of srcs){
        for(let f=0;f<4;f++) if(canPlace(getCards(t),{type:"found",i:f})){ applyMove(t,{type:"found",i:f}); return setTimeout(stepFn, 70); }
      }
    };
    stepFn();
  }

  // ---------- rendering ----------
  const setMsg = t => $("msg").textContent = t;
  function cardEl(c, topOffset, attrs = {}){
    const d = document.createElement("div");
    d.className = "card" + (c.up ? "" : " down") + (isRed(c.s) ? " red" : "");
    d.style.top = topOffset;
    if(c.up){
      d.innerHTML = `<div class="c1">${rl(c.r)}<br>${c.s}</div><div class="big">${c.s}</div><div class="c2">${rl(c.r)}<br>${c.s}</div>`;
      d.setAttribute("aria-label", `${rl(c.r)} of ${c.s}`);
    }
    Object.entries(attrs).forEach(([k,v]) => d.dataset[k] = v);
    return d;
  }
  function slot(label, handler){
    const s = document.createElement("div"); s.className = "slot"; s.textContent = label || "";
    if(handler) s.addEventListener("click", handler);
    return s;
  }
  function renderHud(){
    $("moves").textContent = moves;
    $("time").textContent = fmt(seconds);
    $("timePill").style.display = settings.timer ? "" : "none";
  }
  function foundPileEl(f){
    const pile = document.createElement("div"); pile.className = "pile"; pile.dataset.pile = "f" + f;
    const t = { type:"found", i:f };
    pile.appendChild(slot("A", () => onTarget(t)));
    const p = S.found[f];
    if(p.length){
      const el = cardEl(top(p), "0");
      if(sel && sel.type === "found" && sel.i === f) el.classList.add("sel");
      el.addEventListener("click", () => onTarget(t));
      pile.appendChild(el);
    }
    return pile;
  }
  function render(){
    renderHud();
    $("h1").textContent = "Solitaire — " + NAMES[V] + (V === "spider" ? ` (${settings.suits} suit${settings.suits>1?"s":""})` : "");
    $("subLine").textContent = SUBS[V];
    const topEl = $("top"); topEl.innerHTML = "";

    if(V === "klondike"){
      const stock = document.createElement("div"); stock.className = "pile stock"; stock.dataset.kind = "stock";
      if(S.stock.length){
        const c = cardEl({ up:false }, "0"); c.addEventListener("click", () => onTarget({ type:"stock" })); stock.appendChild(c);
        const n = document.createElement("div"); n.className = "stockCount"; n.textContent = S.stock.length; stock.appendChild(n);
      } else {
        const ok = settings.passes === 0 || S.passes < settings.passes - 1;
        stock.appendChild(slot(S.waste.length && ok ? "↻" : "✕", () => onTarget({ type:"stock" })));
      }
      topEl.appendChild(stock);

      const waste = document.createElement("div"); waste.className = "pile"; waste.dataset.kind = "waste";
      waste.appendChild(slot(""));
      const shown = settings.draw === 3 ? S.waste.slice(-3) : S.waste.slice(-1);
      shown.forEach((c, idx) => {
        const isTop = idx === shown.length - 1;
        const el = cardEl(c, "0");
        el.style.left = `calc(var(--cw) * ${idx * 0.22})`;
        el.style.zIndex = idx + 1;
        if(isTop){
          if(sel && sel.type === "waste") el.classList.add("sel");
          const t = { type:"waste" };
          el.addEventListener("click", () => onTarget(t));
          el.addEventListener("dblclick", () => autoToFoundation(t));
        } else {
          el.classList.add("buried");
          el.addEventListener("click", () => setMsg("Only the top (rightmost) waste card can be played. The ones beneath unlock as you use it."));
        }
        waste.appendChild(el);
      });
      waste.style.width = `calc(var(--cw) * ${settings.draw === 3 ? 1.44 : 1})`;
      topEl.appendChild(waste);
      topEl.appendChild(document.createElement("div"));
      for(let f=0; f<4; f++) topEl.appendChild(foundPileEl(f));
    } else if(V === "spider"){
      const stock = document.createElement("div"); stock.className = "pile stock"; stock.dataset.kind = "stock";
      if(S.stock.length){
        const c = cardEl({ up:false }, "0"); c.addEventListener("click", () => onTarget({ type:"stock" })); stock.appendChild(c);
        const n = document.createElement("div"); n.className = "stockCount"; n.textContent = (S.stock.length / 10) + " deal" + (S.stock.length > 10 ? "s" : ""); stock.appendChild(n);
      } else stock.appendChild(slot("✕"));
      topEl.appendChild(stock);
      topEl.appendChild(document.createElement("div"));
      for(let f=0; f<8; f++){
        const pile = document.createElement("div"); pile.className = "pile";
        pile.appendChild(slot(f < S.found.length ? "" : "K"));
        if(f < S.found.length){ pile.appendChild(cardEl({ r:13, s:S.found[f], up:true }, "0")); }
        topEl.appendChild(pile);
      }
    } else {
      for(let i=0;i<4;i++){
        const pile = document.createElement("div"); pile.className = "pile"; pile.dataset.pile = "cell" + i;
        const t = { type:"cell", i };
        pile.appendChild(slot("", () => onTarget(t)));
        const c = S.cells[i];
        if(c){
          const el = cardEl(c, "0");
          if(sel && sel.type === "cell" && sel.i === i) el.classList.add("sel");
          el.addEventListener("click", () => onTarget(t));
          el.addEventListener("dblclick", () => autoToFoundation(t));
          pile.appendChild(el);
        }
        topEl.appendChild(pile);
      }
      for(let f=0; f<4; f++) topEl.appendChild(foundPileEl(f));
    }

    // tableau
    const tabs = $("tabs"); tabs.innerHTML = "";
    const [offDown, offUp] = OFFS[V];
    for(let i=0;i<S.tab.length;i++){
      const pile = document.createElement("div"); pile.className = "pile"; pile.dataset.pile = "tab" + i;
      const p = S.tab[i];
      let off = 0;
      if(!p.length){
        pile.appendChild(slot(V === "klondike" ? "K" : "", () => onTarget({ type:"tab", i, k:-1 })));
        pile.style.height = "var(--ch)";
      }
      p.forEach((c, k) => {
        const el = cardEl(c, `calc(var(--ch) * ${off.toFixed(3)})`, { k });
        el.style.zIndex = k + 1;
        const t = { type:"tab", i, k };
        if(sel && sel.type === "tab" && sel.i === i && k >= sel.k) el.classList.add("sel");
        el.addEventListener("click", e => { e.stopPropagation(); onTarget(t); });
        el.addEventListener("dblclick", () => autoToFoundation({ type:"tab", i, k:p.length-1 }));
        pile.appendChild(el);
        if(k < p.length-1) off += c.up ? offUp : offDown;
      });
      if(p.length) pile.style.height = `calc(var(--ch) * ${(off + 1).toFixed(3)})`;
      pile.addEventListener("click", () => onTarget({ type:"tab", i, k:-1 })); // blank space under a column targets it
      tabs.appendChild(pile);
    }

    $("undoBtn").disabled = hist.length === 0 || won;
    $("autoBtn").disabled = !canAuto();
    $("hintBtn").disabled = won;
    const s = stats[V];
    $("statsLine").textContent = `${NAMES[V]}: played ${s.games} • won ${s.wins}` + (s.bestTime !== null ? ` • best time ${fmt(s.bestTime)} • fewest moves ${s.bestMoves}` : "");
  }

  // ---------- settings ----------
  function syncFormVisibility(){
    const v = $("setVariant").value;
    $("lblSuits").classList.toggle("off", v !== "spider");
    $("lblDraw").classList.toggle("off", v !== "klondike");
    $("lblPasses").classList.toggle("off", v !== "klondike");
  }
  function fillForm(){
    $("setVariant").value = settings.variant; $("setSuits").value = String(settings.suits);
    $("setDraw").value = String(settings.draw); $("setPasses").value = String(settings.passes);
    $("setTimer").value = settings.timer ? "on" : "off";
    syncFormVisibility();
  }
  $("setVariant").addEventListener("change", syncFormVisibility);
  $("applySettings").addEventListener("click", async () => {
    if(started && !won && !(await RGDialog.confirm("Apply settings and start a new game? The current game will be lost."))) return;
    settings = sanitize({ variant:$("setVariant").value, suits:$("setSuits").value, draw:$("setDraw").value, passes:$("setPasses").value, timer:$("setTimer").value });
    saveJSON("sol_settings", settings); fillForm(); newGame();
  });
  $("clearCache").addEventListener("click", async () => {
    if(!(await RGDialog.confirm("Clear saved Solitaire settings and stats and restore defaults? This starts a new game."))) return;
    try{ localStorage.removeItem("sol_settings"); localStorage.removeItem("sol_stats"); }catch(e){}
    settings = { ...DEFAULTS }; stats = loadStats(); fillForm(); newGame();
  });

  $("newBtn").addEventListener("click", async () => { if(!started || won || await RGDialog.confirm("Abandon this game and deal a new one?")) newGame(); });
  $("bannerNew").addEventListener("click", newGame);
  $("undoBtn").addEventListener("click", undo);
  $("hintBtn").addEventListener("click", hint);
  $("autoBtn").addEventListener("click", autoFinish);
  document.addEventListener("keydown", e => {
    if(e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.key === "u" || ((e.ctrlKey || e.metaKey) && e.key === "z")){ e.preventDefault(); undo(); }
  });

  const saved = loadJSON("sol_settings");
  settings = sanitize({ ...DEFAULTS, ...(saved || {}) });
  stats = loadStats();
  fillForm();
  newGame();
})();
</script>
</body>
</html>
