<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Chess (Vanilla JS)</title>
  <style>
    :root{
      --bg:#0b0f17;
      --line: rgba(255,255,255,.14);
      --text:#e7eefc;
      --muted:#a9b6d3;
      --accent:#6aa6ff;
      --danger:#ff6a6a;
      --ok:#6affb6;
      --radius:18px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 20% 10%, #12203a 0%, var(--bg) 55%) fixed;
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      padding:24px;
    }
    .wrap{ width:min(980px, 100%); display:grid; gap:14px; grid-template-columns: 1fr; }
    .topbar{
      display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .title h1{ margin:0; font-size:18px; letter-spacing:.3px;}
    .title .sub{ color:var(--muted); font-size:12px; margin-top:2px;}
    .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:700;
    }
    button:hover{ background: rgba(255,255,255,.09); }
    button.primary{
      border-color: rgba(106,166,255,.35);
      background: rgba(106,166,255,.12);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(0,0,0,.18);
      font-weight:800;
      font-size:12px;
    }
    .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow:0 0 0 3px rgba(106,166,255,.14); }
    .dot.w{ background: var(--ok); box-shadow:0 0 0 3px rgba(106,255,182,.14); }
    .dot.b{ background: var(--danger); box-shadow:0 0 0 3px rgba(255,106,106,.14); }

    .main{ display:grid; grid-template-columns: 1fr 320px; gap:14px; }
    @media (max-width: 900px){ .main{ grid-template-columns: 1fr; } }

    .boardShell{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding:16px;
      box-shadow: var(--shadow);
    }
    .board{
      width:min(720px, 100%);
      margin: 0 auto;
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
    }
    .sq{
      aspect-ratio: 1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: clamp(22px, 3.3vw, 46px);
      user-select:none;
      cursor:pointer;
      position:relative;
    }
    .light{ background: rgba(255,255,255,.09); }
    .dark{ background: rgba(0,0,0,.22); }
    .sq.sel{ outline: 3px solid rgba(106,166,255,.65); outline-offset:-3px; }

    /* Move hints */
    .sq.legal::after{
      content:"";
      position:absolute;
      width:20%;
      height:20%;
      border-radius:50%;
      background: rgba(106,166,255,.55);
      opacity:.85;
    }
    .sq.capture::after{
      width:72%;
      height:72%;
      border-radius: 999px;
      background: transparent;
      border: 3px solid rgba(255,255,255,.22);
      box-sizing:border-box;
    }

    /* King in check highlight */
    .sq.check{ box-shadow: inset 0 0 0 6px rgba(255,106,106,.25); }

    .side{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius: var(--radius);
      padding:14px;
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height: 200px;
    }
    .msg{
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
      white-space:pre-wrap;
    }
    .sectionTitle{
      margin-top:4px;
      font-weight:900;
      letter-spacing:.2px;
      font-size:12px;
      color: rgba(231,238,252,.88);
    }
    .movesPanel{
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.12);
    }
    .list{
      margin-top:6px;
      font-size:13px;
      line-height:1.35;
      color: rgba(231,238,252,.9);
      max-height: 160px;
      overflow:auto;
    }
    .list code{ color: rgba(231,238,252,.95); }
    .faint{ color: rgba(231,238,252,.55); }

    .history{
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.12);
    }
    .historyBox{
      margin-top:6px;
      font-size:13px;
      line-height:1.35;
      max-height: 260px;
      overflow:auto;
    }
    .historyBox code{ color: rgba(231,238,252,.9); }

    .sq.last{ box-shadow: inset 0 0 0 4px rgba(255,211,106,.4); }
    .mvrow{ display:grid; grid-template-columns:34px 78px 78px; gap:4px; }
    .mvn{ color: rgba(231,238,252,.5); }
    .ply{ padding:0 4px; border-radius:6px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .replaying .ply{ cursor:pointer; }
    .replaying .ply:hover{ background:rgba(255,255,255,.1); }
    .ply.cur{ background:rgba(106,166,255,.35); font-weight:800; }
    .replayBar{ display:none; flex-direction:column; gap:8px; padding:10px; border:1px solid rgba(106,166,255,.45); border-radius:12px; background:rgba(106,166,255,.08); }
    .replayBar.on{ display:flex; }
    .replayBar .rtitle{ font-weight:800; font-size:13px; }
    .replayBar .rrow{ display:flex; gap:6px; flex-wrap:wrap; }
    .replayBar button{ padding:7px 10px; }
    .savePanel{ padding-top:10px; border-top:1px solid rgba(255,255,255,.12); display:grid; gap:8px; }
    .savePanel input[type=text], .savePanel textarea{
      width:100%; padding:8px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--text); font:inherit; font-size:13px;
    }
    .savePanel textarea{ min-height:90px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .row2{ display:flex; gap:6px; flex-wrap:wrap; }
    .row2 button{ padding:7px 10px; font-size:12px; }
    button:disabled{ opacity:.4; cursor:not-allowed; }
    .saveItem{ display:grid; gap:4px; padding:8px; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(0,0,0,.18); }
    .saveItem b{ font-size:13px; word-break:break-word; }
    .saveItem small{ color:rgba(231,238,252,.55); }
    .status{ font-size:12px; color:var(--ok); min-height:16px; }
    .status.err{ color:var(--danger); }
    button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  </style>
</head>

<body>
<a href="../index.html" style="position:fixed;top:8px;left:8px;z-index:9999;padding:4px 10px;border-radius:999px;background:rgba(15,23,42,.8);color:#e2e8f0;font:600 12px system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)">← Games</a>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>Chess (Vanilla JS)</h1>
        <div class="sub">Click a piece → see all legal moves (dots) and a move list. Check rules enforced.</div>
      </div>
      <div class="controls">
        <span class="pill" id="turnPill"><span class="dot" id="turnDot"></span><span id="turnText">Turn: White</span></span>
        <button class="primary" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="main">
      <div class="boardShell">
        <div class="board" id="board"></div>
      </div>

      <div class="side" id="sidePanel">
        <div class="replayBar" id="replayBar">
          <div class="rtitle" id="replayTitle">Replay</div>
          <div class="rrow">
            <button id="rFirst" title="Start (Home)">⏮</button>
            <button id="rPrev" title="Back (←)">◀</button>
            <button id="rAuto" title="Auto-play">▶ Play</button>
            <button id="rNext" title="Forward (→)">▶▶</button>
            <button id="rLast" title="End (End)">⏭</button>
          </div>
          <div class="rrow">
            <button id="rContinue" class="primary">Play on from here</button>
            <button id="rExit">Exit replay</button>
          </div>
        </div>

        <div class="msg" id="msg"></div>

        <div class="movesPanel">
          <div class="sectionTitle">Selected piece legal moves</div>
          <div class="list" id="selectedMoves"></div>
        </div>

        <div class="history">
          <div class="sectionTitle">Move history</div>
          <div class="historyBox" id="history"></div>
        </div>

        <div class="savePanel">
          <div class="sectionTitle">Save &amp; load (algebraic notation)</div>
          <input type="text" id="saveName" maxlength="80" placeholder="Name this game (optional)" aria-label="Game name" />
          <div class="row2">
            <button id="saveBtn" class="primary">💾 Save game</button>
            <button id="copyBtn">📋 Copy PGN</button>
            <button id="replayCurBtn">⏪ Replay this game</button>
          </div>
          <div class="status" id="saveStatus" role="status"></div>
          <div class="sectionTitle">Saved games <span class="faint" id="saveWhere"></span></div>
          <div id="saveList"></div>
          <details>
            <summary class="sectionTitle" style="cursor:pointer">Import a PGN</summary>
            <textarea id="pgnIn" placeholder="Paste PGN or moves like: 1. e4 e5 2. Nf3 Nc6" aria-label="PGN text"></textarea>
            <div class="row2" style="margin-top:6px">
              <button id="pgnReplay">▶ Replay</button>
              <button id="pgnSave">💾 Save</button>
            </div>
          </details>
        </div>
      </div>
    </div>
  </div>

<script src="../scores.js"></script>
<script>
(() => {
  // Piece codes: "wP", "bK", etc. Board is [r][c], r=0 top (black side), r=7 bottom (white side)
  const U = {
    wK:"♔", wQ:"♕", wR:"♖", wB:"♗", wN:"♘", wP:"♙",
    bK:"♚", bQ:"♛", bR:"♜", bB:"♝", bN:"♞", bP:"♟"
  };

  const boardEl = document.getElementById("board");
  const msgEl = document.getElementById("msg");
  const historyEl = document.getElementById("history");
  const selectedMovesEl = document.getElementById("selectedMoves");
  const resetBtn = document.getElementById("resetBtn");
  const turnText = document.getElementById("turnText");
  const turnDot = document.getElementById("turnDot");

  let board, turn, selected, legalMoves, gameOver;
  let castling, epTarget; // castling rights {wK,wQ,bK,bQ}; en passant target square {r,c} or null
  let moveList = [];            // SAN strings for the live game, e.g. "e4", "Nf3", "O-O", "exd5", "e8=Q#"
  let result = "*", lastMove = null;
  let replay = null, liveStash = null; // replay mode: {sans,states,lasts,idx,name,timer}

  function initPosition(){
    return [
      ["bR","bN","bB","bQ","bK","bB","bN","bR"],
      ["bP","bP","bP","bP","bP","bP","bP","bP"],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ["wP","wP","wP","wP","wP","wP","wP","wP"],
      ["wR","wN","wB","wQ","wK","wB","wN","wR"]
    ];
  }

  function reset(){
    board = initPosition();
    turn = "w";
    selected = null;
    legalMoves = [];
    gameOver = false;
    if(replay){ stopAuto(); replay = null; liveStash = null; }
    moveList = [];
    result = "*"; lastMove = null;
    castling = {wK:true, wQ:true, bK:true, bQ:true};
    epTarget = null;
    setMsg(
`Rules in this version:
- All legal moves shown (dots) + listed in sidebar ✅
- Check enforced: you cannot make a move that leaves your king in check ✅
- Pawn double-step ✅, promotion ✅ (auto-queen)
- Castling ✅, En passant ✅`
    );
    render();
  }

  function setMsg(t){ msgEl.textContent = t; }
  function inBounds(r,c){ return r>=0 && r<8 && c>=0 && c<8; }
  function pieceColor(p){ return p ? p[0] : null; }
  function pieceType(p){ return p ? p[1] : null; }
  function cloneBoard(b){ return b.map(row => row.slice()); }

  const LINES = []; // not used, leaving room for future helpers

  function findKing(b, color){
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        if(b[r][c] === color+"K") return {r,c};
      }
    }
    return null;
  }

  function pseudoMovesForPiece(b, r, c, attacksOnly=false){
    const p = b[r][c];
    if(!p) return [];
    const col = pieceColor(p);
    const type = pieceType(p);
    const opp = col==="w" ? "b" : "w";
    const out = [];
    const add = (rr,cc) => { if(inBounds(rr,cc)) out.push({r:rr,c:cc}); };

    if(type==="N"){
      const d = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for(const [dr,dc] of d){
        const rr=r+dr, cc=c+dc;
        if(!inBounds(rr,cc)) continue;
        const t=b[rr][cc];
        if(!t || pieceColor(t)!==col) add(rr,cc);
      }
      return out;
    }

    if(type==="K"){
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const rr=r+dr, cc=c+dc;
          if(!inBounds(rr,cc)) continue;
          const t=b[rr][cc];
          if(!t || pieceColor(t)!==col) add(rr,cc);
        }
      }
      return out;
    }

    if(type==="P"){
      const dir = (col==="w") ? -1 : 1;
      const startRow = (col==="w") ? 6 : 1;

      // pawn attacks
      for(const dc of [-1, 1]){
        const rr = r + dir, cc = c + dc;
        if(!inBounds(rr,cc)) continue;
        if(attacksOnly){
          add(rr,cc);
        } else {
          const t=b[rr][cc];
          if(t && pieceColor(t)===opp) add(rr,cc);
          else if(!t && epTarget && epTarget.r===rr && epTarget.c===cc) out.push({r:rr,c:cc,ep:true});
        }
      }
      if(attacksOnly) return out;

      // pawn forward
      const one = r + dir;
      if(inBounds(one,c) && b[one][c]===null){
        add(one,c);
        const two = r + 2*dir;
        if(r===startRow && inBounds(two,c) && b[two][c]===null){
          add(two,c);
        }
      }
      return out;
    }

    // Sliding pieces
    const dirs = [];
    if(type==="B" || type==="Q") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if(type==="R" || type==="Q") dirs.push([-1,0],[1,0],[0,-1],[0,1]);

    for(const [dr,dc] of dirs){
      let rr=r+dr, cc=c+dc;
      while(inBounds(rr,cc)){
        const t=b[rr][cc];
        if(t===null){
          add(rr,cc);
        } else {
          if(pieceColor(t)!==col) add(rr,cc);
          break;
        }
        rr+=dr; cc+=dc;
      }
    }
    return out;
  }

  function isSquareAttacked(b, tr, tc, byColor){
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p=b[r][c];
        if(!p || pieceColor(p)!==byColor) continue;
        const pseudo = pseudoMovesForPiece(b, r, c, true);
        if(pseudo.some(m => m.r===tr && m.c===tc)) return true;
      }
    }
    return false;
  }

  function isInCheck(b, color){
    const k = findKing(b, color);
    if(!k) return false;
    const opp = color==="w" ? "b" : "w";
    return isSquareAttacked(b, k.r, k.c, opp);
  }

  function legalMovesFrom(b, r, c, color){
    const p=b[r][c];
    if(!p || pieceColor(p)!==color) return [];
    const pseudo = pseudoMovesForPiece(b, r, c, false);
    const out = [];

    // castling (only for the king on its home square, and never out of / through check)
    if(pieceType(p)==="K" && r===(color==="w"?7:0) && c===4 && !isInCheck(b, color)){
      const opp = color==="w" ? "b" : "w";
      if(castling[color+"K"] && b[r][7]===color+"R" && !b[r][5] && !b[r][6]
         && !isSquareAttacked(b,r,5,opp)){
        pseudo.push({r, c:6, castle:"K"});
      }
      if(castling[color+"Q"] && b[r][0]===color+"R" && !b[r][1] && !b[r][2] && !b[r][3]
         && !isSquareAttacked(b,r,3,opp)){
        pseudo.push({r, c:2, castle:"Q"});
      }
    }

    for(const m of pseudo){
      const nb = cloneBoard(b);
      applyMove(nb, r, c, m);

      // key rule: move must not leave your king in check
      if(!isInCheck(nb, color)) out.push(m);
    }
    return out;
  }

  // Applies a move to board b (mutates it): handles en passant, castling and auto-queen promotion.
  // Returns the captured piece, if any.
  function applyMove(b, sr, sc, m){
    const moving = b[sr][sc];
    let captured = b[m.r][m.c];
    if(m.ep){
      captured = b[sr][m.c];
      b[sr][m.c] = null;
    }
    b[m.r][m.c] = moving;
    b[sr][sc] = null;
    if(m.castle){
      const rookFrom = m.castle==="K" ? 7 : 0;
      const rookTo = m.castle==="K" ? 5 : 3;
      b[m.r][rookTo] = b[m.r][rookFrom];
      b[m.r][rookFrom] = null;
    }
    if(pieceType(moving)==="P"){
      if(pieceColor(moving)==="w" && m.r===0) b[m.r][m.c] = "wQ";
      if(pieceColor(moving)==="b" && m.r===7) b[m.r][m.c] = "bQ";
    }
    return captured;
  }

  function anyLegalMove(b, color){
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        if(b[r][c] && pieceColor(b[r][c])===color){
          if(legalMovesFrom(b,r,c,color).length) return true;
        }
      }
    }
    return false;
  }

  function coordToAlg(r,c){
    return "abcdefgh"[c] + String(8 - r);
  }

  function pieceName(p){
    const t = pieceType(p);
    if(t==="K") return "King";
    if(t==="Q") return "Queen";
    if(t==="R") return "Rook";
    if(t==="B") return "Bishop";
    if(t==="N") return "Knight";
    return "Pawn";
  }

  function updateSelectedMovesPanel(){
    if(!selected){
      selectedMovesEl.innerHTML = `<span class="faint">Click a piece to see its legal moves.</span>`;
      return;
    }
    const p = board[selected.r][selected.c];
    if(!p){
      selectedMovesEl.innerHTML = `<span class="faint">No piece selected.</span>`;
      return;
    }
    const from = coordToAlg(selected.r, selected.c);
    if(legalMoves.length === 0){
      selectedMovesEl.innerHTML =
        `<span class="faint">${pieceName(p)} at <b>${from}</b> has no legal moves right now.</span>`;
      return;
    }

    const items = legalMoves.map(m => {
      const to = coordToAlg(m.r, m.c);
      if(m.castle) return `<code>${m.castle==="K" ? "O-O" : "O-O-O"}</code>`;
      const cap = (board[m.r][m.c] || m.ep) ? " x" : "";
      return `<code>${from}→${to}${cap}</code>`;
    });
    selectedMovesEl.innerHTML = items.join("<br>");
  }

    // ================= Algebraic notation (SAN) =================
  const fileOf = c => "abcdefgh"[c];

  // SAN for a move *before* it is played (no check/mate suffix yet).
  function sanBase(sr, sc, mv){
    if(mv.castle) return mv.castle==="K" ? "O-O" : "O-O-O";
    const p = board[sr][sc], t = pieceType(p), col = pieceColor(p);
    const capture = !!(board[mv.r][mv.c] || mv.ep);
    let s = "";
    if(t==="P"){
      if(capture) s += fileOf(sc) + "x";
      s += coordToAlg(mv.r, mv.c);
      if(mv.r===0 || mv.r===7) s += "=Q"; // this game always promotes to a queen
      return s;
    }
    s += t;
    // disambiguate if another identical piece can also legally reach the square
    const others = [];
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      if((r===sr && c===sc) || board[r][c] !== p) continue;
      if(legalMovesFrom(board, r, c, col).some(m => m.r===mv.r && m.c===mv.c && !m.castle)) others.push({r,c});
    }
    if(others.length){
      const sameFile = others.some(o => o.c===sc), sameRank = others.some(o => o.r===sr);
      if(!sameFile) s += fileOf(sc);
      else if(!sameRank) s += String(8 - sr);
      else s += fileOf(sc) + String(8 - sr);
    }
    if(capture) s += "x";
    return s + coordToAlg(mv.r, mv.c);
  }

  // Plays a legal move on the global position (board/turn/castling/epTarget) and returns its full SAN.
  function commitMove(sr, sc, mv){
    const moving = board[sr][sc], mover = turn;
    const base = sanBase(sr, sc, mv);
    applyMove(board, sr, sc, mv);
    if(pieceType(moving)==="K"){ castling[mover+"K"] = false; castling[mover+"Q"] = false; }
    for(const [cr,cc,key] of [[7,0,"wQ"],[7,7,"wK"],[0,0,"bQ"],[0,7,"bK"]]){
      if((sr===cr && sc===cc) || (mv.r===cr && mv.c===cc)) castling[key] = false;
    }
    epTarget = (pieceType(moving)==="P" && Math.abs(mv.r-sr)===2) ? {r:(mv.r+sr)/2, c:mv.c} : null;
    turn = mover==="w" ? "b" : "w";
    const inCheck = isInCheck(board, turn), hasMove = anyLegalMove(board, turn);
    return { san: base + (inCheck ? (hasMove ? "+" : "#") : ""), inCheck, hasMove, mover };
  }

  // Finds the legal move in the current position that matches a SAN token (or null).
  function findMoveBySAN(token){
    const want = token.replace(/[+#!?]+$/,"").replace(/0/g,"O");
    for(let r=0;r<8;r++) for(let c=0;c<8;c++){
      if(pieceColor(board[r][c]) !== turn) continue;
      for(const mv of legalMovesFrom(board, r, c, turn)){
        if(sanBase(r, c, mv) === want) return { sr:r, sc:c, mv };
      }
    }
    return null;
  }

  const snapshot = () => ({ board: cloneBoard(board), turn, castling: {...castling}, epTarget: epTarget ? {...epTarget} : null });
  function restore(st){
    board = cloneBoard(st.board); turn = st.turn; castling = {...st.castling};
    epTarget = st.epTarget ? {...st.epTarget} : null; selected = null; legalMoves = [];
  }
  const freshState = () => ({ board:initPosition(), turn:"w", castling:{wK:true,wQ:true,bK:true,bQ:true}, epTarget:null });

  // ================= PGN =================
  function toPGN(sans, res, name){
    const d = new Date(), pad = n => String(n).padStart(2,"0");
    const esc = t => String(t).replace(/["\\\r\n]/g," ");
    const head = [["Event", name || "Casual game"], ["Site","Random Games"], ["Date", `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`],
      ["Round","-"], ["White","White"], ["Black","Black"], ["Result", res || "*"]]
      .map(([k,v]) => `[${k} "${esc(v)}"]`).join("\n");
    const parts = [];
    sans.forEach((m,i) => { if(i%2===0) parts.push(`${i/2+1}.`); parts.push(m); });
    parts.push(res || "*");
    // wrap the move text at ~80 columns
    const lines = []; let line = "";
    for(const w of parts){ if((line + " " + w).trim().length > 80){ lines.push(line); line = w; } else line = (line + " " + w).trim(); }
    if(line) lines.push(line);
    return head + "\n\n" + lines.join("\n") + "\n";
  }
  // Returns {sans, name, result} from PGN text (headers, comments, variations, move numbers are ignored).
  function parsePGN(text){
    const name = (text.match(/\[Event\s+"([^"]*)"\]/) || [])[1] || "";
    const res = (text.match(/\[Result\s+"([^"]*)"\]/) || [])[1] || "*";
    let body = text.replace(/\[[^\]]*\]/g," ").replace(/\{[^}]*\}/g," ").replace(/;[^\n]*/g," ");
    let prev; do { prev = body; body = body.replace(/\([^()]*\)/g," "); } while(body !== prev);
    body = body.replace(/\$\d+/g," ").replace(/\d+\.(\.\.)?/g," ");
    const sans = body.split(/\s+/).filter(t => t && !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t));
    return { sans, name: name === "Casual game" ? "" : name, result: res };
  }

  // ================= Replay =================
  function stopAuto(){ if(replay && replay.timer){ clearInterval(replay.timer); replay.timer = null; } }
  // Builds every position of a game from its SAN list. Returns an error string or null.
  function startReplay(sans, name){
    if(!sans.length) return "There are no moves to replay.";
    const keep = snapshot();
    restore(freshState());
    const states = [snapshot()], lasts = [null], norm = [];
    for(let i=0;i<sans.length;i++){
      const found = findMoveBySAN(sans[i]);
      if(!found){
        restore(keep);
        const underpromo = /=[RBN]/.test(sans[i]) ? " (promotion to anything but a queen isn't supported)" : "";
        return `Move ${Math.floor(i/2)+1}${i%2 ? "…" : "."} “${sans[i]}” isn't legal in that position${underpromo}.`;
      }
      const out = commitMove(found.sr, found.sc, found.mv);
      norm.push(out.san); states.push(snapshot()); lasts.push({ sr:found.sr, sc:found.sc, r:found.mv.r, c:found.mv.c });
    }
    restore(keep);
    if(!replay){
      liveStash = { state: snapshot(), moveList: moveList.slice(), gameOver, result, lastMove, msg: msgEl.textContent };
    } else stopAuto();
    replay = { sans: norm, states, lasts, idx: 0, name: name || "Saved game", timer: null };
    gameOver = false;
    showPly(0);
    return null;
  }
  function showPly(i){
    if(!replay) return;
    replay.idx = Math.max(0, Math.min(replay.sans.length, i));
    restore(replay.states[replay.idx]);
    const n = replay.sans.length, k = replay.idx;
    setMsg(k===0 ? "Start position." : `After ${Math.ceil(k/2)}${k%2 ? "." : "…"} ${replay.sans[k-1]}` + (k===n ? "  (end of game)" : ""));
    render();
  }
  function toggleAuto(){
    if(!replay) return;
    if(replay.timer){ stopAuto(); renderReplayBar(); return; }
    if(replay.idx >= replay.sans.length) showPly(0);
    replay.timer = setInterval(() => {
      if(!replay || replay.idx >= replay.sans.length){ stopAuto(); renderReplayBar(); return; }
      showPly(replay.idx + 1);
    }, 900);
    renderReplayBar();
  }
  function exitReplay(){
    if(!replay) return;
    stopAuto(); replay = null;
    const l = liveStash; liveStash = null;
    restore(l.state); moveList = l.moveList; gameOver = l.gameOver; result = l.result; lastMove = l.lastMove;
    setMsg(l.msg); render();
  }
  function continueFromReplay(){
    if(!replay) return;
    stopAuto();
    const k = replay.idx, st = replay.states[k], sans = replay.sans.slice(0, k), last = replay.lasts[k];
    replay = null; liveStash = null;
    restore(st); moveList = sans; lastMove = last; result = "*";
    const inCheck = isInCheck(board, turn), hasMove = anyLegalMove(board, turn);
    gameOver = !hasMove;
    if(!hasMove){ result = inCheck ? (turn==="w" ? "0-1" : "1-0") : "1/2-1/2"; }
    setMsg(!hasMove ? (inCheck ? `Checkmate! ${turn==="w" ? "Black" : "White"} wins.` : "Stalemate. It's a draw.") : `${turn==="w" ? "White" : "Black"} to move — continuing from the replay.`);
    render();
  }
  function renderReplayBar(){
    const bar = $id("replayBar");
    bar.classList.toggle("on", !!replay);
    $id("sidePanel").classList.toggle("replaying", !!replay);
    if(!replay) return;
    $id("replayTitle").textContent = `▶ ${replay.name} — move ${replay.idx}/${replay.sans.length}`;
    $id("rAuto").textContent = replay.timer ? "⏸ Pause" : "▶ Play";
    $id("rFirst").disabled = $id("rPrev").disabled = replay.idx === 0;
    $id("rNext").disabled = $id("rLast").disabled = replay.idx >= replay.sans.length;
  }

  // ================= Save / load =================
  const $id = id => document.getElementById(id);
  const LOCAL_KEY = "chess_saves";
  let inApp = false;
  function localSaves(){ try{ const a = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function setLocalSaves(a){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(a)); return true; }catch(e){ return false; } }
  function status(t, err){ const e = $id("saveStatus"); e.textContent = t; e.classList.toggle("err", !!err); }
  async function detectHost(){ try{ inApp = !!(window.RGHost && await window.RGHost.available()); }catch(e){ inApp = false; } }

  async function storeSave(name, pgn){
    if(inApp){ await window.RGHost.call("SaveGame", "chess", name, pgn); return; }
    const a = localSaves();
    if(a.length >= 100) throw new Error("Too many saved games in this browser (100). Delete some first.");
    a.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,7), name, data: pgn, created: new Date().toISOString() });
    if(!setLocalSaves(a)) throw new Error("Browser storage is unavailable.");
  }
  async function listSaves(){
    if(inApp){ const l = await window.RGHost.call("ListSaves", "chess"); return Array.isArray(l) ? l : []; }
    return localSaves().slice().sort((a,b) => (b.created||"").localeCompare(a.created||""));
  }
  async function removeSave(id){
    if(inApp) await window.RGHost.call("DeleteSave", id);
    else setLocalSaves(localSaves().filter(x => x.id !== id));
  }
  function defaultName(){
    return new Date().toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" }) + " · " + moveList.length + " moves";
  }
  async function saveCurrent(){
    if(replay){ status("Exit the replay to save the live game.", true); return; }
    if(!moveList.length){ status("Play at least one move first.", true); return; }
    const name = $id("saveName").value.trim() || defaultName();
    try{ await storeSave(name, toPGN(moveList, result, name)); status("Saved “" + name + "”."); $id("saveName").value = ""; }
    catch(e){ status("Could not save: " + e.message, true); return; }
    refreshSaves();
  }
  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
    try{
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
    }catch(e){ return false; }
  }
  async function refreshSaves(){
    const box = $id("saveList");
    let list = [];
    try{ list = await listSaves(); }catch(e){ box.textContent = "Could not load saved games: " + e.message; return; }
    $id("saveWhere").textContent = inApp ? "(stored in the app)" : "(stored in this browser)";
    box.innerHTML = "";
    if(!list.length){ const p = document.createElement("div"); p.className = "faint"; p.textContent = "None yet."; box.appendChild(p); return; }
    list.forEach(sv => {
      const item = document.createElement("div"); item.className = "saveItem";
      const b = document.createElement("b"); b.textContent = sv.name || "Untitled";
      const sm = document.createElement("small");
      const parsed = parsePGN(sv.data || "");
      sm.textContent = `${parsed.sans.length} plies · ${parsed.result} · ${sv.created ? new Date(sv.created).toLocaleDateString() : ""}`;
      const row = document.createElement("div"); row.className = "row2";
      const mk = (label, fn) => { const bt = document.createElement("button"); bt.textContent = label; bt.addEventListener("click", fn); row.appendChild(bt); return bt; };
      mk("▶ Replay", () => { const err = startReplay(parsed.sans, sv.name); status(err || "", !!err); });
      mk("📋 Copy", async () => status((await copyText(sv.data)) ? "PGN copied." : "Could not copy.", false));
      const del = mk("✕ Delete", async () => {
        if(del.dataset.armed !== "1"){ del.dataset.armed = "1"; del.textContent = "Sure?"; setTimeout(() => { del.dataset.armed = ""; del.textContent = "✕ Delete"; }, 3000); return; }
        try{ await removeSave(sv.id); }catch(e){ status("Could not delete: " + e.message, true); return; }
        refreshSaves();
      });
      item.append(b, sm, row); box.appendChild(item);
    });
  }

  function onSquareClick(r,c){
    if(gameOver || replay) return;

    const p = board[r][c];
    const col = pieceColor(p);

    // Selecting
    if(!selected){
      if(p && col===turn){
        selected = {r,c};
        legalMoves = legalMovesFrom(board, r, c, turn);

        // UX: if in check and this piece can't help, tell the user
        if(isInCheck(board, turn) && legalMoves.length === 0){
          setMsg(`${turn==="w" ? "White" : "Black"} is in check. That piece can't resolve it.`);
        }
      }
      render();
      return;
    }

    // Reselect to another own piece
    if(p && col===turn){
      selected = {r,c};
      legalMoves = legalMovesFrom(board, r, c, turn);
      if(isInCheck(board, turn) && legalMoves.length === 0){
        setMsg(`${turn==="w" ? "White" : "Black"} is in check. That piece can't resolve it.`);
      }
      render();
      return;
    }

    // Attempt move
    const ok = legalMoves.some(m => m.r===r && m.c===c);
    if(!ok){
      selected = null;
      legalMoves = [];
      render();
      return;
    }

    const sr=selected.r, sc=selected.c;
    const mv = legalMoves.find(m => m.r===r && m.c===c);
    const out = commitMove(sr, sc, mv);
    moveList.push(out.san);
    lastMove = { sr, sc, r, c };
    selected = null;
    legalMoves = [];

    // AUTO END: checkmate / stalemate detection (turn has already passed to the opponent)
    const inCheck = out.inCheck, hasMove = out.hasMove;
    if(!hasMove){
      gameOver = true;
      if(inCheck){
        result = out.mover === "w" ? "1-0" : "0-1";
        setMsg(`Checkmate! ${turn==="w" ? "Black" : "White"} wins.`);
      } else {
        result = "1/2-1/2";
        setMsg(`Stalemate. It's a draw.`);
      }
    } else if(inCheck){
      setMsg(`${turn==="w" ? "White" : "Black"} is in check. Only moves that escape check are allowed.`);
    } else {
      setMsg(`${turn==="w" ? "White" : "Black"} to move.`);
    }

    render();
  }

  function render(){
    // Turn pill
    turnText.textContent = replay ? "Replay" : `Turn: ${turn==="w" ? "White" : "Black"}`;
    turnDot.className = "dot " + (turn==="w" ? "w" : "b");

    // history (algebraic notation, one row per full move)
    const sans = replay ? replay.sans : moveList;
    const cur = replay ? replay.idx : -1;
    let hist = "";
    for(let i=0;i<sans.length;i+=2){
      const cell = k => k < sans.length ? `<span class="ply${cur===k+1 ? " cur" : ""}" data-ply="${k+1}">${sans[k]}</span>` : "<span></span>";
      hist += `<div class="mvrow"><span class="mvn">${i/2+1}.</span>${cell(i)}${cell(i+1)}</div>`;
    }
    historyEl.innerHTML = hist || `<span class="faint">None yet</span>`;
    if(replay){ const c = historyEl.querySelector(".cur"); if(c) c.scrollIntoView({block:"nearest"}); }
    else historyEl.scrollTop = historyEl.scrollHeight;
    renderReplayBar();
    $id("saveBtn").disabled = !!replay || moveList.length === 0;
    $id("replayCurBtn").disabled = !!replay || moveList.length === 0;
    $id("copyBtn").disabled = !!replay || moveList.length === 0;
    const lm = replay ? replay.lasts[replay.idx] : lastMove;

    // check highlight info
    const king = findKing(board, turn);
    const kingInCheck = king ? isInCheck(board, turn) : false;

    // board
    boardEl.innerHTML = "";
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const sq = document.createElement("div");
        sq.className = "sq " + (((r+c)%2===0) ? "light" : "dark");

        if(selected && selected.r===r && selected.c===c) sq.classList.add("sel");
        if(lm && ((lm.sr===r && lm.sc===c) || (lm.r===r && lm.c===c))) sq.classList.add("last");

        if(legalMoves.some(m => m.r===r && m.c===c)){
          sq.classList.add("legal");
          if(board[r][c] !== null) sq.classList.add("capture");
        }

        if(kingInCheck && king && king.r===r && king.c===c) sq.classList.add("check");

        const p = board[r][c];
        sq.textContent = p ? U[p] : "";
        sq.addEventListener("click", () => onSquareClick(r,c));
        boardEl.appendChild(sq);
      }
    }

    updateSelectedMovesPanel();
  }

  resetBtn.addEventListener("click", reset);
  historyEl.addEventListener("click", e => {
    const t = e.target.closest(".ply");
    if(replay && t) { stopAuto(); showPly(Number(t.dataset.ply)); }
  });
  $id("rFirst").addEventListener("click", () => { stopAuto(); showPly(0); });
  $id("rPrev").addEventListener("click", () => { stopAuto(); showPly(replay.idx - 1); });
  $id("rNext").addEventListener("click", () => { stopAuto(); showPly(replay.idx + 1); });
  $id("rLast").addEventListener("click", () => { stopAuto(); showPly(replay.sans.length); });
  $id("rAuto").addEventListener("click", toggleAuto);
  $id("rExit").addEventListener("click", exitReplay);
  $id("rContinue").addEventListener("click", continueFromReplay);
  document.addEventListener("keydown", e => {
    if(!replay || ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); stopAuto(); showPly(replay.idx - 1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); stopAuto(); showPly(replay.idx + 1); }
    else if(e.key === "Home"){ e.preventDefault(); stopAuto(); showPly(0); }
    else if(e.key === "End"){ e.preventDefault(); stopAuto(); showPly(replay.sans.length); }
    else if(e.key === " "){ e.preventDefault(); toggleAuto(); }
  });
  $id("saveBtn").addEventListener("click", saveCurrent);
  $id("copyBtn").addEventListener("click", async () => {
    status((await copyText(toPGN(moveList, result, "Casual game"))) ? "PGN copied to the clipboard." : "Could not copy.", false);
  });
  $id("replayCurBtn").addEventListener("click", () => { const err = startReplay(moveList.slice(), "This game"); status(err || "", !!err); });
  function importedGame(){
    const g = parsePGN($id("pgnIn").value);
    if(!g.sans.length){ status("No moves found in that text.", true); return null; }
    return g;
  }
  $id("pgnReplay").addEventListener("click", () => { const g = importedGame(); if(!g) return; const err = startReplay(g.sans, g.name || "Imported game"); status(err || "", !!err); });
  $id("pgnSave").addEventListener("click", async () => {
    const g = importedGame(); if(!g) return;
    // validate by building the replay positions without switching views
    const keep = snapshot(); restore(freshState()); let bad = null;
    for(let i=0;i<g.sans.length && !bad;i++){ const f = findMoveBySAN(g.sans[i]); if(!f) bad = `Move ${Math.floor(i/2)+1}${i%2?"…":"."} “${g.sans[i]}” isn't legal.`; else commitMove(f.sr, f.sc, f.mv); }
    restore(keep);
    if(bad){ status(bad, true); return; }
    const name = g.name || $id("saveName").value.trim() || "Imported game";
    try{ await storeSave(name, toPGN(g.sans, g.result, name)); status("Saved “" + name + "”."); }catch(e){ status("Could not save: " + e.message, true); return; }
    refreshSaves();
  });

  reset();
  detectHost().then(refreshSaves);
})();
</script>
</body>
</html>
