<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Chess</title>
  <style>
    :root{
      --bg:#0b0f17; --line:rgba(255,255,255,.14); --text:#e7eefc; --muted:#a9b6d3;
      --accent:#6aa6ff; --danger:#ff6a6a; --ok:#6affb6; --gold:#ffd36a;
      --radius:18px; --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; justify-content:center;
      background:radial-gradient(1100px 600px at 18% 0%, #1a2b52 0%, #0e1527 46%, var(--bg) 82%) fixed;
      color:var(--text); font-family:ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      padding:44px 16px 24px;
    }
    .wrap{ width:min(1060px,100%); display:grid; gap:12px; align-content:start; }
    .topbar{
      display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
      padding:14px 16px; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    }
    .title h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:.4px; }
    .title h1 span{ background:linear-gradient(90deg,#fff,#a9c7ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .title .sub{ color:var(--muted); font-size:12px; margin-top:3px; }
    .grp{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
    .seg{ display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:rgba(0,0,0,.25); }
    .seg button{ border:0; border-radius:0; background:transparent; padding:9px 12px; font-size:13px; }
    .seg button + button{ border-left:1px solid var(--line); }
    .elo{ display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.25); font-size:13px; }
    .elo input{ width:150px; accent-color:#6aa6ff; }
    .seg button.on{ background:linear-gradient(180deg, rgba(106,166,255,.42), rgba(106,166,255,.16)); color:#fff; }
    button, select{ font:inherit; }
    button{
      border:1px solid var(--line); background:rgba(255,255,255,.07); color:var(--text);
      padding:9px 14px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; transition:filter .12s, transform .12s;
    }
    button:hover:not(:disabled){ filter:brightness(1.25); }
    button:active:not(:disabled){ transform:scale(.96); }
    button:disabled{ opacity:.4; cursor:not-allowed; }
    button.primary{ border-color:rgba(106,166,255,.55); background:linear-gradient(180deg, rgba(106,166,255,.42), rgba(106,166,255,.16)); }
    select{ border:1px solid var(--line); background:rgba(0,0,0,.35); color:var(--text); padding:9px 10px; border-radius:12px; font-size:13px; font-weight:700; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:rgba(0,0,0,.28); font-weight:700; font-size:12px; }
    .dot{ width:11px; height:11px; border-radius:50%; background:var(--accent); border:1px solid rgba(0,0,0,.4); }
    .dot.w{ background:#fff; box-shadow:0 0 8px rgba(255,255,255,.6); } .dot.b{ background:#15161c; border-color:#8a93a8; }

    .main{ display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:14px; align-items:start; }
    @media (max-width: 920px){ .main{ grid-template-columns:1fr; } }

    /* ---------- board area ---------- */
    .boardShell{
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02)); border:1px solid var(--line);
      border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); display:grid; gap:8px; justify-items:center;
    }
    .strip{
      width:min(640px,100%); display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:12px; background:rgba(0,0,0,.25); border:1px solid transparent;
      min-height:40px; transition:border-color .2s, box-shadow .2s;
    }
    .strip.active{ border-color:rgba(255,211,106,.55); box-shadow:0 0 14px rgba(255,211,106,.25); }
    .strip .who{ font-weight:800; font-size:14px; white-space:nowrap; }
    .strip .who i{ font-style:normal; color:var(--muted); font-weight:600; font-size:12px; }
    .strip .caps{ display:flex; flex-wrap:wrap; align-items:center; font-size:20px; line-height:1; min-height:22px; flex:1; letter-spacing:-3px; }
    .strip .caps .cp{ filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
    .strip .caps .cp.w{ color:#fff; } .strip .caps .cp.b{ color:#1a1b22; text-shadow:0 0 2px rgba(255,255,255,.55); }
    .strip .adv{ font-weight:800; color:var(--ok); font-size:13px; min-width:26px; text-align:right; }
    .bwrap{ position:relative; width:min(640px,100%); }
    .board{
      --sq:80px; --sqL:#eeeed2; --sqD:#769656;
      position:relative; width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
      border-radius:10px; overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.55), 0 0 0 5px #2a1d12, 0 0 0 6px rgba(255,255,255,.18);
      touch-action:none; user-select:none; -webkit-user-select:none;
    }
    .board[data-theme="walnut"]{ --sqL:#f0d9b5; --sqD:#b58863; }
    .board[data-theme="ocean"]{ --sqL:#dee3e6; --sqD:#8ca2ad; }
    .board[data-theme="midnight"]{ --sqL:#9aa6c8; --sqD:#4a5882; }
    .board[data-theme="rose"]{ --sqL:#f6e3e8; --sqD:#c1798f; }
    .sq{ position:relative; display:grid; place-items:center; }
    .sq.light{ background:var(--sqL); } .sq.dark{ background:var(--sqD); }
    .sq.last::before{ content:""; position:absolute; inset:0; background:rgba(255,222,60,.42); }
    .sq.sel::before{ content:""; position:absolute; inset:0; background:rgba(80,150,255,.55); }
    .sq.check::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,40,40,.95) 0%, rgba(255,40,40,.55) 40%, transparent 72%); }
    .sq.hintA::before, .sq.hintB::before{ content:""; position:absolute; inset:0; background:rgba(60,220,140,.55); animation:hint .8s ease-in-out infinite; }
    @keyframes hint{ 50%{ opacity:.35; } }
    .sq.legal::after{ content:""; position:absolute; width:30%; height:30%; border-radius:50%; background:rgba(20,30,50,.32); pointer-events:none; }
    .sq.legal.capture::after{ width:88%; height:88%; background:transparent; border:calc(var(--sq) * .08) solid rgba(20,30,50,.32); }
    .sq.legal{ cursor:pointer; }
    .pc{
      position:relative; z-index:2; font-size:calc(var(--sq) * .82); line-height:1; cursor:grab; pointer-events:none;
      font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif;
    }
    .pc.w{ color:#fff; -webkit-text-stroke:calc(var(--sq) * .018) #2b2b33; text-shadow:0 2px 3px rgba(0,0,0,.45); }
    .pc.b{ color:#1b1c23; -webkit-text-stroke:calc(var(--sq) * .012) #000; text-shadow:0 1px 0 rgba(255,255,255,.25), 0 2px 3px rgba(0,0,0,.4); }
    .sq.dragsrc .pc{ opacity:.25; }
    .ghost{ position:fixed; z-index:99999; pointer-events:none; transform:translate(-50%,-52%); font-size:calc(var(--sq, 80px) * .95); line-height:1;
      font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif; filter:drop-shadow(0 8px 8px rgba(0,0,0,.5)); }
    .ghost.w{ color:#fff; -webkit-text-stroke:1.5px #2b2b33; } .ghost.b{ color:#1b1c23; -webkit-text-stroke:1px #000; }
    .co{ position:absolute; font-style:normal; font-weight:800; font-size:calc(var(--sq) * .17); pointer-events:none; z-index:1; opacity:.85; }
    .co.rk{ top:3%; left:5%; } .co.fl{ bottom:2%; right:5%; }
    .sq.light .co{ color:var(--sqD); } .sq.dark .co{ color:var(--sqL); }

    .over{ position:absolute; inset:0; z-index:20; display:none; place-items:center; background:rgba(6,9,16,.62); backdrop-filter:blur(2px); border-radius:10px; }
    .over.show{ display:grid; }
    .over .card{ text-align:center; padding:22px 26px; border-radius:16px; background:rgba(16,22,38,.95); border:1px solid rgba(255,211,106,.55); box-shadow:0 20px 50px rgba(0,0,0,.6); animation:pop .45s cubic-bezier(.2,1.6,.4,1); }
    .over .ot{ font-size:28px; font-weight:900; letter-spacing:1px; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .over .os{ color:var(--muted); margin:6px 0 14px; font-size:14px; }
    @keyframes pop{ from{ transform:scale(.4); opacity:0; } }
    .promo{ position:absolute; inset:0; z-index:25; display:none; place-items:center; background:rgba(6,9,16,.6); border-radius:10px; }
    .promo.show{ display:grid; }
    .promo .card{ display:flex; gap:8px; padding:14px; border-radius:16px; background:rgba(16,22,38,.96); border:1px solid rgba(255,255,255,.25); }
    .promo button{ width:calc(var(--sq) * .95); height:calc(var(--sq) * .95); padding:0; font-size:calc(var(--sq) * .72); line-height:1; border-radius:12px; background:#cdd4e6; font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",serif; }
    .promo button.w{ color:#fff; -webkit-text-stroke:1.5px #2b2b33; background:#7f8aa8; } .promo button.b{ color:#1b1c23; background:#d8dcea; }

    /* ---------- side panel ---------- */
    .side{
      background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.02)); border:1px solid var(--line); border-radius:var(--radius);
      padding:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; min-height:200px;
    }
    .msg{ color:var(--muted); font-size:13px; line-height:1.4; white-space:pre-wrap; min-height:20px; }
    .sectionTitle{ margin-top:4px; font-weight:900; letter-spacing:.2px; font-size:12px; color:rgba(231,238,252,.88); }
    .faint{ color:rgba(231,238,252,.55); }
    .history{ padding-top:10px; border-top:1px solid rgba(255,255,255,.12); }
    .historyBox{ margin-top:6px; font-size:13px; line-height:1.45; max-height:250px; overflow:auto; }
    .mvrow{ display:grid; grid-template-columns:34px 78px 78px; gap:4px; }
    .mvn{ color:rgba(231,238,252,.5); }
    .ply{ padding:0 4px; border-radius:6px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .replaying .ply{ cursor:pointer; }
    .replaying .ply:hover{ background:rgba(255,255,255,.1); }
    .ply.cur{ background:rgba(106,166,255,.35); font-weight:800; }
    .replayBar{ display:none; flex-direction:column; gap:8px; padding:10px; border:1px solid rgba(106,166,255,.45); border-radius:12px; background:rgba(106,166,255,.08); }
    .replayBar.on{ display:flex; }
    .replayBar .rtitle{ font-weight:800; font-size:13px; }
    .replayBar .rrow{ display:flex; gap:6px; flex-wrap:wrap; }
    .replayBar button{ padding:7px 10px; }
    .savePanel{ padding-top:10px; border-top:1px solid rgba(255,255,255,.12); display:grid; gap:8px; }
    .savePanel input[type=text], .savePanel textarea{
      width:100%; padding:8px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.3); color:var(--text); font:inherit; font-size:13px;
    }
    .savePanel textarea{ min-height:90px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .row2{ display:flex; gap:6px; flex-wrap:wrap; }
    .row2 button{ padding:7px 10px; font-size:12px; }
    .saveItem{ display:grid; gap:4px; padding:8px; border:1px solid rgba(255,255,255,.1); border-radius:10px; background:rgba(0,0,0,.18); }
    .saveItem b{ font-size:13px; word-break:break-word; }
    .saveItem small{ color:rgba(231,238,252,.55); }
    .status{ font-size:12px; color:var(--ok); min-height:16px; }
    .status.err{ color:var(--danger); }
    @media (prefers-reduced-motion:reduce){ .sq.hintA::before, .sq.hintB::before{ animation:none; } }
  </style>
<script src="../themes.js"></script>
</head>

<body>
<a href="../index.html" style="position:fixed;top:8px;left:8px;z-index:9999;padding:4px 10px;border-radius:999px;background:rgba(15,23,42,.8);color:#e2e8f0;font:600 12px system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2)">← Games</a>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>♞ <span>Chess</span></h1>
        <div class="sub">Full rules • play the computer or a friend • drag or click • hints, takebacks, save &amp; replay</div>
      </div>
      <span class="pill" id="turnPill"><span class="dot" id="turnDot"></span><span id="turnText">Turn: White</span></span>
    </div>

    <div class="bar">
      <div class="grp">
        <div class="seg" id="modeSeg" role="group" aria-label="Opponent"><button data-v="cpu">vs Computer</button><button data-v="2p">2 Players</button></div>
        <div class="seg" id="diffSeg" role="group" aria-label="Difficulty"><button data-v="easy">Easy</button><button data-v="medium">Medium</button><button data-v="hard">Hard</button></div>
        <div class="seg" id="engSeg" role="group" aria-label="Computer engine" title="Built-in engine, or the Stockfish engine (bundled, works offline)"><button data-v="builtin">Built-in</button><button data-v="stockfish">Stockfish</button></div>
        <label class="elo" id="eloWrap" title="Stockfish strength (Elo rating)">Strength <input type="range" id="eloRange" min="1320" max="3200" step="10" aria-label="Stockfish strength"><b id="eloText"></b></label>
        <div class="seg" id="sideSeg" role="group" aria-label="You play"><button data-v="w">Play White</button><button data-v="b">Play Black</button></div>
      </div>
      <div class="grp">
        <select id="themeSel" aria-label="Board theme">
          <option value="classic">Classic green</option><option value="walnut">Walnut</option><option value="ocean">Ocean</option>
          <option value="midnight">Midnight</option><option value="rose">Rose</option>
          <option value="season:spring">🌸 Spring</option><option value="season:summer">☀️ Summer</option>
          <option value="season:fall">🍂 Fall</option><option value="season:winter">❄️ Winter</option>
          <option value="season:halloween">🎃 Halloween</option><option value="season:thanksgiving">🦃 Thanksgiving</option><option value="season:christmas">🎄 Christmas</option><option value="season:easter">🐰 Easter</option><option value="season:auto">🗓️ Auto (by date)</option>
        </select>
        <button id="flipBtn" title="Flip the board">⇅ Flip</button>
        <button id="hintBtn">💡 Hint</button>
        <button id="undoBtn">↶ Undo</button>
        <button class="primary" id="resetBtn">New game</button>
      </div>
    </div>

    <div class="main">
      <div class="boardShell">
        <div class="strip" id="stripTop"><span class="who" id="whoTop"></span><span class="caps" id="capTop"></span><span class="adv" id="advTop"></span></div>
        <div class="bwrap">
          <div class="board" id="board" data-theme="classic"></div>
          <div class="promo" id="promo"><div class="card" id="promoCard"></div></div>
          <div class="over" id="over"><div class="card"><div class="ot" id="overT"></div><div class="os" id="overS"></div>
            <div class="row2" style="justify-content:center"><button class="primary" id="overNew">Rematch</button><button id="overReplay">⏪ Replay game</button></div></div></div>
        </div>
        <div class="strip" id="stripBot"><span class="who" id="whoBot"></span><span class="caps" id="capBot"></span><span class="adv" id="advBot"></span></div>
      </div>

      <div class="side" id="sidePanel">
        <div class="replayBar" id="replayBar">
          <div class="rtitle" id="replayTitle">Replay</div>
          <div class="rrow">
            <button id="rFirst" title="Start (Home)">⏮</button>
            <button id="rPrev" title="Back (←)">◀</button>
            <button id="rAuto" title="Auto-play">▶ Play</button>
            <button id="rNext" title="Forward (→)">▶▶</button>
            <button id="rLast" title="End (End)">⏭</button>
          </div>
          <div class="rrow">
            <button id="rContinue" class="primary">Play on from here</button>
            <button id="rExit">Exit replay</button>
          </div>
        </div>

        <div class="msg" id="msg"></div>

        <div class="history">
          <div class="sectionTitle">Move history</div>
          <div class="historyBox" id="history"></div>
        </div>

        <div class="savePanel">
          <div class="sectionTitle">Save &amp; load (algebraic notation)</div>
          <input type="text" id="saveName" maxlength="80" placeholder="Name this game (optional)" aria-label="Game name" />
          <div class="row2">
            <button id="saveBtn" class="primary">💾 Save game</button>
            <button id="copyBtn">📋 Copy PGN</button>
            <button id="replayCurBtn">⏪ Replay this game</button>
          </div>
          <div class="status" id="saveStatus" role="status"></div>
          <div class="sectionTitle">Saved games <span class="faint" id="saveWhere"></span></div>
          <div id="saveList"></div>
          <details>
            <summary class="sectionTitle" style="cursor:pointer">Import a PGN</summary>
            <textarea id="pgnIn" placeholder="Paste PGN or moves like: 1. e4 e5 2. Nf3 Nc6" aria-label="PGN text"></textarea>
            <div class="row2" style="margin-top:6px">
              <button id="pgnReplay">▶ Replay</button>
              <button id="pgnSave">💾 Save</button>
            </div>
          </details>
        </div>
      </div>
    </div>
  </div>

<script src="../scores.js"></script>

<script>
(() => {
  "use strict";
  const FX = window.RGFx || { sound(){}, confetti(){}, reducedMotion:false };
  const rgReport = (...a) => { try{ window.RGScores && window.RGScores.report(...a); }catch(e){} };
  const $id = id => document.getElementById(id);
  // Filled glyphs for both colours (the text-variation selector stops platforms swapping in emoji); colour comes from CSS.
  const G = { K:"\u265A\uFE0E", Q:"\u265B\uFE0E", R:"\u265C\uFE0E", B:"\u265D\uFE0E", N:"\u265E\uFE0E", P:"\u265F\uFE0E" };
  const U = {}; for(const t of Object.keys(G)){ U["w" + t] = G[t]; U["b" + t] = G[t]; }

  const boardEl = $id("board");
  const msgEl = $id("msg");
  const historyEl = $id("history");
  const turnText = $id("turnText");
  const turnDot = $id("turnDot");

  let board, turn, selected, legalMoves, gameOver;
  let moveList = [];            // SAN strings for the live game, e.g. "e4", "Nf3", "O-O", "exd5", "e8=Q#"
  let result = "*", lastMove = null;
  let replay = null, liveStash = null; // replay mode: {sans,states,lasts,caps,idx,name,timer}
  let hist = [], halfmove = 0, posKeys = [], endReason = "";   // undo history, fifty-move clock, repetition tracking
  let thinking = false, flipped = false, hintMove = null, aiToken = 0, drag = null, promoPending = false;
  let settings = { mode:"cpu", diff:"medium", side:"w", theme:"classic", engine:"builtin", elo:1800 };

  function setMsg(t){ msgEl.textContent = t; }

  // ===== CHESS ENGINE (rules + computer opponent; no DOM)
  let castling, epTarget; // castling rights {wK,wQ,bK,bQ}; en passant target square {r,c} or null
  function initPosition(){
    return [
      ["bR","bN","bB","bQ","bK","bB","bN","bR"],
      ["bP","bP","bP","bP","bP","bP","bP","bP"],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      [null,null,null,null,null,null,null,null],
      ["wP","wP","wP","wP","wP","wP","wP","wP"],
      ["wR","wN","wB","wQ","wK","wB","wN","wR"]
    ];
  }

  function inBounds(r,c){ return r>=0 && r<8 && c>=0 && c<8; }
  function pieceColor(p){ return p ? p[0] : null; }
  function pieceType(p){ return p ? p[1] : null; }
  function cloneBoard(b){ return b.map(row => row.slice()); }

  function findKing(b, color){
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        if(b[r][c] === color+"K") return {r,c};
      }
    }
    return null;
  }

  function pseudoMovesForPiece(b, r, c, attacksOnly=false){
    const p = b[r][c];
    if(!p) return [];
    const col = pieceColor(p);
    const type = pieceType(p);
    const opp = col==="w" ? "b" : "w";
    const out = [];
    const add = (rr,cc) => { if(inBounds(rr,cc)) out.push({r:rr,c:cc}); };

    if(type==="N"){
      const d = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for(const [dr,dc] of d){
        const rr=r+dr, cc=c+dc;
        if(!inBounds(rr,cc)) continue;
        const t=b[rr][cc];
        if(!t || pieceColor(t)!==col) add(rr,cc);
      }
      return out;
    }

    if(type==="K"){
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const rr=r+dr, cc=c+dc;
          if(!inBounds(rr,cc)) continue;
          const t=b[rr][cc];
          if(!t || pieceColor(t)!==col) add(rr,cc);
        }
      }
      return out;
    }

    if(type==="P"){
      const dir = (col==="w") ? -1 : 1;
      const startRow = (col==="w") ? 6 : 1;

      // pawn attacks
      for(const dc of [-1, 1]){
        const rr = r + dir, cc = c + dc;
        if(!inBounds(rr,cc)) continue;
        if(attacksOnly){
          add(rr,cc);

    $id("replayCurBtn").disabled = inReplay || moveList.length === 0;
    $id("copyBtn").disabled = inReplay || moveList.length === 0;
    $id("undoBtn").disabled = inReplay || thinking || !hist.length;
    $id("hintBtn").disabled = !humanTurn();
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === settings.mode));
    document.querySelectorAll("#diffSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === settings.diff));
    document.querySelectorAll("#sideSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === settings.side));
    const cpu = settings.mode === "cpu";
    const sf = settings.engine === "stockfish";
    $id("diffSeg").style.display = cpu && !sf ? "" : "none";
    $id("eloWrap").style.display = cpu && sf ? "" : "none";
    $id("sideSeg").style.display = $id("engSeg").style.display = cpu ? "" : "none";
    $id("eloRange").value = settings.elo; $id("eloText").textContent = settings.elo >= 3200 ? "Max" : settings.elo;
    document.querySelectorAll("#engSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === settings.engine));
    syncSeason(); boardEl.dataset.theme = settings.theme;

    const lm = inReplay ? replay.lasts[replay.idx] : lastMove;
    const king = findKing(board, turn), kingInCheck = king ? isInCheck(board, turn) : false;
    boardEl.innerHTML = "";
    for(let vr=0; vr<8; vr++){
      for(let vc=0; vc<8; vc++){
        const r = flipped ? 7 - vr : vr, c = flipped ? 7 - vc : vc;
        const sq = document.createElement("div");
        sq.className = "sq " + (((r + c) % 2 === 0) ? "light" : "dark");
        sq.dataset.r = r; sq.dataset.c = c;
        if(selected && selected.r === r && selected.c === c) sq.classList.add("sel");
        if(lm && ((lm.sr === r && lm.sc === c) || (lm.r === r && lm.c === c))) sq.classList.add("last");
        if(hintMove && !inReplay){
          if(hintMove.sr === r && hintMove.sc === c) sq.classList.add("hintA");
          if(hintMove.r === r && hintMove.c === c) sq.classList.add("hintB");
        }
        if(legalMoves.some(m => m.r === r && m.c === c)){ sq.classList.add("legal"); if(board[r][c] !== null || legalMoves.some(m => m.r === r && m.c === c && m.ep)) sq.classList.add("capture"); }
        if(kingInCheck && king && king.r === r && king.c === c) sq.classList.add("check");
        if(vc === 0){ const i = document.createElement("i"); i.className = "co rk"; i.textContent = 8 - r; sq.appendChild(i); }
        if(vr === 7){ const i = document.createElement("i"); i.className = "co fl"; i.textContent = "abcdefgh"[c]; sq.appendChild(i); }
        const p = board[r][c];
        if(p){ const s = document.createElement("span"); s.className = "pc " + p[0]; s.textContent = U[p]; sq.appendChild(s); }
        boardEl.appendChild(sq);
      }
    }
    renderStrips();
    const ov = $id("over"), showOver = gameOver && !inReplay;
    ov.classList.toggle("show", showOver);
    if(showOver){
      const draw = result === "1/2-1/2", w = result === "1-0" ? "White" : "Black";
      $id("overT").textContent = draw ? "Draw" : "Checkmate!";
      $id("overS").textContent = draw ? cap1(endReason) : cpu ? (w[0].toLowerCase() === settings.side ? "You win as " + w + "! 🎉" : "The computer wins as " + w + ".") : w + " wins.";
    }
    if(anim) animateMove(anim);
  }

  // ----- settings & buttons -----
  async function setSetting(k, v){
    if(settings[k] === v) return;
    if((k === "mode" || k === "side") && hist.length && !gameOver && !replay){
      if(!(await ask("Change this setting and start a new game? The current game will be lost."))) return;
    }
    settings[k] = v; saveSettings(); FX.sound("click");
    if(k === "mode" || k === "side") newGame(); else render();
  }
  $id("modeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setSetting("mode", b.dataset.v); });
  $id("diffSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setSetting("diff", b.dataset.v); });
  $id("engSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ if(b.dataset.v === "stockfish") sfStart().catch(() => {}); setSetting("engine", b.dataset.v); } });
  $id("eloRange").addEventListener("input", e => { settings.elo = Number(e.target.value); $id("eloText").textContent = settings.elo >= 3200 ? "Max" : settings.elo; });
  $id("eloRange").addEventListener("change", () => { saveSettings(); render(); });
  $id("sideSeg").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setSetting("side", b.dataset.v); });
  // Board colours: the plain themes, plus the shared seasonal themes (themes.js), which also recolour the pieces and page.
  $id("themeSel").addEventListener("change", e => {
    const v = e.target.value, T = window.RGThemes;
    if(v.startsWith("season:")){ if(T) T.set(v.slice(7)); FX.sound("click"); syncSeason(); return; }
    if(T) T.set("classic");
    setSetting("theme", v); syncSeason();
  });
  function syncSeason(){
    const T = window.RGThemes, sel = $id("themeSel");
    sel.value = T && T.get() !== "classic" ? "season:" + T.get() : settings.theme;
  }
  window.addEventListener("rg-season", syncSeason);
  $id("flipBtn").addEventListener("click", () => { flipped = !flipped; FX.sound("click"); render(); });
  $id("hintBtn").addEventListener("click", hint);
  $id("undoBtn").addEventListener("click", undo);
  $id("resetBtn").addEventListener("click", async () => {
    if(hist.length && !gameOver && !replay && !(await ask("Abandon this game and start a new one?"))) return;
    newGame();
  });
  $id("overNew").addEventListener("click", newGame);
  $id("overReplay").addEventListener("click", () => { const err = startReplay(moveList.slice(), "This game"); status(err || "", !!err); });
  window.addEventListener("resize", sizeBoard);

  historyEl.addEventListener("click", e => {
    const t = e.target.closest(".ply");
    if(replay && t) { stopAuto(); showPly(Number(t.dataset.ply)); }
  });
  $id("rFirst").addEventListener("click", () => { stopAuto(); showPly(0); });
  $id("rPrev").addEventListener("click", () => { stopAuto(); showPly(replay.idx - 1); });
  $id("rNext").addEventListener("click", () => { stopAuto(); showPly(replay.idx + 1); });
  $id("rLast").addEventListener("click", () => { stopAuto(); showPly(replay.sans.length); });
  $id("rAuto").addEventListener("click", toggleAuto);
  $id("rExit").addEventListener("click", exitReplay);
  $id("rContinue").addEventListener("click", continueFromReplay);
  document.addEventListener("keydown", e => {
    if(!replay || ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)) return;
    if(e.key === "ArrowLeft"){ e.preventDefault(); stopAuto(); showPly(replay.idx - 1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); stopAuto(); showPly(replay.idx + 1); }
    else if(e.key === "Home"){ e.preventDefault(); stopAuto(); showPly(0); }
    else if(e.key === "End"){ e.preventDefault(); stopAuto(); showPly(replay.sans.length); }
    else if(e.key === " "){ e.preventDefault(); toggleAuto(); }
  });
  $id("saveBtn").addEventListener("click", saveCurrent);
  $id("copyBtn").addEventListener("click", async () => {
    status((await copyText(toPGN(moveList, result, "Casual game"))) ? "PGN copied to the clipboard." : "Could not copy.", false);
  });
  $id("replayCurBtn").addEventListener("click", () => { const err = startReplay(moveList.slice(), "This game"); status(err || "", !!err); });
  function importedGame(){
    const g = parsePGN($id("pgnIn").value);
    if(!g.sans.length){ status("No moves found in that text.", true); return null; }
    return g;
  }
  $id("pgnReplay").addEventListener("click", () => { const g = importedGame(); if(!g) return; const err = startReplay(g.sans, g.name || "Imported game"); status(err || "", !!err); });
  $id("pgnSave").addEventListener("click", async () => {
    const g = importedGame(); if(!g) return;
    // validate by building the replay positions without switching views
    const keep = snapshot(); restore(freshState()); let bad = null;
    for(let i=0;i<g.sans.length && !bad;i++){ const f = findMoveBySAN(g.sans[i]); if(!f) bad = `Move ${Math.floor(i/2)+1}${i%2?"…":"."} “${g.sans[i]}” isn't legal.`; else commitMove(f.sr, f.sc, f.mv); }
    restore(keep);
    if(bad){ status(bad, true); return; }
    const name = g.name || $id("saveName").value.trim() || "Imported game";
    try{ await storeSave(name, toPGN(g.sans, g.result, name)); status("Saved “" + name + "”."); }catch(e){ status("Could not save: " + e.message, true); return; }
    refreshSaves();
  });

  loadSettings();
  newGame();
  detectHost().then(refreshSaves);
})();
</script>
</body>
</html>
