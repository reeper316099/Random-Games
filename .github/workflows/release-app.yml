name: Release desktop app

# Push a tag like v1.0.0 to build the app for Windows, macOS and Linux and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
# "Run workflow" (workflow_dispatch) builds everything and uploads the files as run artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wails-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails-app/go.mod
          cache-dependency-path: wails-app/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Copy games into the app bundle
        run: ./sync-games.sh
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./internal/...

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
          - name: macos
            os: macos-latest
            platform: darwin/universal
          - name: linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails-app/go.mod
          cache-dependency-path: wails-app/go.sum

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Copy games into the app bundle
        shell: bash
        working-directory: wails-app
        run: ./sync-games.sh

      - name: Build
        shell: bash
        working-directory: wails-app
        run: |
          if [ -n "${{ matrix.tags }}" ]; then
            wails build -clean -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"
          else
            wails build -clean -platform "${{ matrix.platform }}"
          fi

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: wails-app/build/bin
        run: Compress-Archive -Path RandomGames.exe -DestinationPath "../../RandomGames-windows-amd64.zip"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        shell: bash
        working-directory: wails-app/build/bin
        run: ditto -c -k --keepParent RandomGames.app "../../RandomGames-macos-universal.zip"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        shell: bash
        working-directory: wails-app/build/bin
        run: tar -czf "../../RandomGames-linux-amd64.tar.gz" RandomGames

      - uses: actions/upload-artifact@v4
        with:
          name: RandomGames-${{ matrix.name }}
          path: |
            wails-app/RandomGames-*.zip
            wails-app/RandomGames-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
