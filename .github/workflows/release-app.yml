name: Release desktop app

# Push a tag like v1.0.0 to build installers for Windows, macOS and Linux and publish a GitHub Release:
#   git tag -a v1.0.0 -m "message" && git push origin v1.0.0
# "Run workflow" (workflow_dispatch) builds everything and keeps the files as run artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wails-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails-app/go.mod
          cache-dependency-path: wails-app/go.sum
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Copy games into the app bundle
        run: ./sync-games.sh
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./internal/...

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            platform: windows/amd64
          - name: macos
            os: macos-latest
            platform: darwin/universal
          - name: linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails-app/go.mod
          cache-dependency-path: wails-app/go.sum

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS (Windows installer builder)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_NUM=${V%%-*}" >> "$GITHUB_ENV"   # Windows needs plain x.y.z (no -beta suffix)

      - name: Stamp the version into the app
        shell: bash
        working-directory: wails-app
        run: node -e "const fs=require('fs'),j=JSON.parse(fs.readFileSync('wails.json'));j.info.productVersion=process.env.VERSION_NUM;fs.writeFileSync('wails.json',JSON.stringify(j,null,2))"

      - name: Copy games into the app bundle
        shell: bash
        working-directory: wails-app
        run: ./sync-games.sh

      - name: Build
        shell: bash
        working-directory: wails-app
        run: |
          FLAGS="-clean -platform ${{ matrix.platform }}"
          if [ -n "${{ matrix.tags }}" ]; then FLAGS="$FLAGS -tags ${{ matrix.tags }}"; fi
          if [ "${{ matrix.name }}" = "windows" ]; then FLAGS="$FLAGS -nsis"; fi
          wails build $FLAGS

      - name: Package (Windows installer + portable zip)
        if: matrix.name == 'windows'
        shell: pwsh
        working-directory: wails-app
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build/bin/RandomGames.exe -DestinationPath out/RandomGames-windows-amd64-portable.zip
          $installer = Get-ChildItem build/bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "The NSIS installer was not produced" }
          Copy-Item $installer.FullName out/RandomGames-windows-amd64-setup.exe

      - name: Package (macOS dmg)
        if: matrix.name == 'macos'
        shell: bash
        working-directory: wails-app
        run: scripts/make-dmg.sh out/RandomGames-macos-universal.dmg

      - name: Package (Linux deb + tarball)
        if: matrix.name == 'linux'
        shell: bash
        working-directory: wails-app
        run: |
          scripts/make-deb.sh "$VERSION" out/RandomGames-linux-amd64.deb
          tar -czf out/RandomGames-linux-amd64.tar.gz -C build/bin RandomGames

      - uses: actions/upload-artifact@v4
        with:
          name: RandomGames-${{ matrix.name }}
          path: wails-app/out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List files
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
